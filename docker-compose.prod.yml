# 生产环境 Docker Compose 配置
# 使用：docker compose -f docker-compose.prod.yml up -d --build
# 包含：nginx 前端 + FastAPI 后端 + PostgreSQL + 可选监控栈

# ── 容器 stdout 日志上限 ──────────────────────────────────
# Docker 默认的 json-file 驱动**没有任何大小上限**：容器打的每一行 stdout
# 都无限追加到 /var/lib/docker/containers/<id>/<id>-json.log，
# 只有删容器才会释放。这是与应用内 LOG_FILE 轮转**互相独立的第二条**
# 无界增长路径 —— 应用侧修好了轮转，这一条照样能把宿主盘写满。
#
# 写满盘的后果不是"日志丢了"，而是 PostgreSQL 数据卷所在分区写入失败。
#
# 每服务上限 10 MiB × 3 个文件 = 30 MiB，11 个服务合计上界约 330 MiB，有界。
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Nginx 反向代理（HTTP-only，TLS 由上游反向代理终止）
  nginx:
    image: nginx:alpine
    container_name: airdrop-nginx
    logging: *default-logging
    # 宿主机 18080 → 容器 80（避免与其它项目 80 冲突）
    ports:
      - "18080:80"
    volumes:
      - ./docker/nginx/nginx-http.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    networks:
      - frontend

  # Next.js 前端（主前端，宿主机 13002 → 容器 3002）
  frontend:
    build:
      context: .
      dockerfile: frontend-next/Dockerfile
    container_name: airdrop-frontend
    logging: *default-logging
    ports:
      - "13002:3002"
    environment:
      - PORT=3002
      - HOSTNAME=0.0.0.0
      # 后端内网地址。Next 的 rewrite 与 proxy.ts 都用它，不能填公网域名 ——
      # 容器内 fetch 公网域名要出网再绕回来穿 nginx。
      - API_PROXY_TARGET=http://web:8002
      # 管理员密钥，必须与后端 API_KEY 同值。
      #
      # ⚠️ 缺这个键的后果是**静默的**：`proxy.ts:128` 在拿不到密钥时按
      # "MVP 无鉴权模式"处理，直接放行且不注入任何凭据 —— 于是后端
      # `API_KEY` 非空时全站 401，而前端日志里什么异常都没有。
      # 用 `:?` 让它缺失即启动失败，而不是起来了但点不动。
      - BACKEND_API_KEY=${BACKEND_API_KEY:?请在 .env 里设置 BACKEND_API_KEY（与后端 API_KEY 同值），见 docs/GO_LIVE_CHECKLIST.md §1c}
    restart: unless-stopped
    networks:
      - frontend
      - backend

  # FastAPI 后端服务
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: airdrop-web
    logging: *default-logging
    expose:
      - "8002"
    environment:
      # ⚠️ 生产 compose 自己钉死 production，绝不信任 .env 里的 APP_ENV。
      # `.env.example` 的值是 development，若只是 env_file 继承，它会让
      # config.py 中 API_KEY / JWT / CORS / PG 弱密码的生产启动闸门全部跳过，
      # 容器照样变绿但运行的并不是生产安全口径。
      - APP_ENV=production
      - PORT=8002
      - DATABASE_URL=postgresql://airdrop:${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD（生产必须强密码）}@db:5432/airdrop
      # 用 :? 而非裸 ${API_KEY}：environment 的插值即便展开成空串也会**覆盖**
      # env_file 里的正确值。裸写法只给 Compose 一个 warning，后端却变成
      # "API_KEY 为空 = 鉴权中间件短路"，是公网零鉴权的静默事故。
      - API_KEY=${API_KEY:?请在 .env 里设置 API_KEY（至少 32 字符随机字符串）}
      # LLM 可选，留空时规则引擎仍完整可用；用 :- 防止 warning。
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CRON_HOUR=8
      - CRON_MINUTE=0
      # 后端日志落盘（相对 /app/backend 工作目录），promtail 采集宿主 ./logs
      - LOG_FILE=${LOG_FILE:-logs/backend.log}
      # OpenTelemetry 链路追踪（配合 observability profile 的 otel-collector + jaeger）
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-airdrop-alpha}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-traceidratio}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-0.1}
    env_file:
      - .env
    volumes:
      - ./data:/app/backend/data
      - ./backups:/app/backups
      # 日志卷：宿主 ./logs 同时被 promtail 以 :ro 挂载采集（/var/log/app/*.log）
      - ./logs:/app/backend/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - frontend
      - backend

  # PostgreSQL 数据库
  db:
    image: postgres:15-alpine
    container_name: airdrop-db
    logging: *default-logging
    environment:
      - POSTGRES_DB=airdrop
      - POSTGRES_USER=airdrop
      # 同 grafana：裸 `${VAR}` 未设置时是空串 + 一行 warning，不阻止启动。
      # PG 收到空密码会拒绝初始化数据目录，于是容器反复重启 —— 吵闹但至少
      # 不会带着弱密码跑起来。改 `:?` 是为了让失败发生在 compose 解析阶段，
      # 报错直接指出缺哪个变量，而不是让人去翻 PG 容器日志。
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD（生成：python -c "import secrets; print(secrets.token_urlsafe(24))"）}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups/pg:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airdrop"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:latest
    container_name: airdrop-prometheus
    logging: *default-logging
    # 宿主机 19090 → 容器 9090
    ports:
      - "19090:9090"
    volumes:
      - ./configs/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/observability/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - backend
      - monitoring

  # Alertmanager 告警通知（Telegram）
  alertmanager:
    image: prom/alertmanager:latest
    container_name: airdrop-alertmanager
    logging: *default-logging
    # 宿主机 19093 → 容器 9093
    ports:
      - "19093:9093"
    volumes:
      - ./configs/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        cp /etc/alertmanager/alertmanager.yml /tmp/alertmanager.yml
        sed -i "s/__TELEGRAM_BOT_TOKEN__/${TELEGRAM_BOT_TOKEN:-placeholder}/g" /tmp/alertmanager.yml
        sed -i "s/__TELEGRAM_CHAT_ID__/${TELEGRAM_CHAT_ID:-1}/g" /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    networks:
      - monitoring

  # Grafana 面板
  grafana:
    image: grafana/grafana:latest
    container_name: airdrop-grafana
    logging: *default-logging
    # 宿主机 13000 → 容器 3000
    ports:
      - "13000:3000"
    environment:
      # `:?` 而非裸 `${GRAFANA_PASSWORD}`：裸写法在未设置时展开成**空串**，
      # compose 只打一行 warning 就继续启动，而 Grafana 收到空密码会回落到
      # 内置默认 `admin/admin` —— 一个挂在 13000 端口的匿名可登录监控面板，
      # 里面有全部业务指标。缺失必须是启动失败，不是静默降级。
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?请在 .env 里设置 GRAFANA_PASSWORD（否则 Grafana 会回落到默认 admin/admin）}
      # Grafana 13 移除了经典面板文件的预置支持（GitHub #123607），
      # 禁用 v2 dashboard 特性开关以恢复文件预置加载（community workaround）
      - GF_FEATURE_TOGGLES_kubernetesDashboards=false
      - GF_FEATURE_TOGGLES_dashboardNewLayouts=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./configs/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - monitoring

  # 可选：Loki 日志集中采集（P2）
  # 使用 profile "observability" 默认不启动；启动命令：
  # docker compose --profile observability -f docker-compose.prod.yml up -d loki promtail otel-collector jaeger
  loki:
    image: grafana/loki:2.9.0
    container_name: airdrop-loki
    logging: *default-logging
    profiles: ["observability"]
    # 宿主机 13100 → 容器 3100
    ports:
      - "13100:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:2.9.0
    container_name: airdrop-promtail
    logging: *default-logging
    profiles: ["observability"]
    volumes:
      - ./docker/loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/app:ro
      - ./docker/nginx/logs:/var/log/nginx:ro
    depends_on:
      - loki
    networks:
      - monitoring

  # 可选：OpenTelemetry Collector（P2）
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    container_name: airdrop-otel
    logging: *default-logging
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./configs/observability/otel/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    # 宿主机 14317/14318/18889 → 容器 4317/4318/8889
    ports:
      - "14317:4317"   # OTLP gRPC
      - "14318:4318"   # OTLP HTTP
      - "18889:8889"   # Prometheus exporter
    networks:
      - backend   # web 通过 backend 网络上报 trace
      - monitoring  # non-internal 网络：允许宿主端口发布 + Prometheus 抓取

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: airdrop-jaeger
    logging: *default-logging
    profiles: ["observability"]
    # 宿主机 11686 → 容器 16686
    ports:
      - "11686:16686"
    networks:
      - backend   # 接收 otel-collector 的 trace
      - monitoring  # non-internal 网络：允许宿主访问 Jaeger UI

volumes:
  pgdata:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true  # 后端网络不暴露到外部
  monitoring:
    driver: bridge
