# 生产环境 Docker Compose 配置
# 使用：docker compose -f docker-compose.prod.yml up -d --build
# 包含：nginx 前端 + FastAPI 后端 + PostgreSQL + 可选监控栈

services:
  # Nginx 反向代理（HTTP-only，TLS 由上游反向代理终止）
  nginx:
    image: nginx:alpine
    container_name: airdrop-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx-http.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    networks:
      - frontend

  # Next.js 前端（主前端）
  frontend:
    build:
      context: .
      dockerfile: frontend-next/Dockerfile
    container_name: airdrop-frontend
    expose:
      - "3002"
    environment:
      - PORT=3002
      - HOSTNAME=0.0.0.0
      # 前端通过 nginx 反代访问 API，无需直连后端
      - API_PROXY_TARGET=http://web:8002
    restart: unless-stopped
    networks:
      - frontend
      - backend

  # FastAPI 后端服务
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: airdrop-web
    expose:
      - "8002"
    environment:
      - PORT=8002
      - DATABASE_URL=postgresql://airdrop:${POSTGRES_PASSWORD}@db:5432/airdrop
      - API_KEY=${API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CRON_HOUR=8
      - CRON_MINUTE=0
    env_file:
      - .env
    volumes:
      - ./data:/app/backend/data
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - frontend
      - backend

  # PostgreSQL 数据库
  db:
    image: postgres:15-alpine
    container_name: airdrop-db
    environment:
      - POSTGRES_DB=airdrop
      - POSTGRES_USER=airdrop
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups/pg:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airdrop"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  # 可选：Prometheus 监控
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: airdrop-prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #   networks:
  #     - backend

  # 可选：Grafana 面板
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: airdrop-grafana
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
  #   volumes:
  #     - grafana-data:/var/lib/grafana
  #   networks:
  #     - backend

  # 可选：Loki 日志集中采集（P2）
  # 使用 profile "observability" 默认不启动；启动命令：
  # docker compose --profile observability -f docker-compose.prod.yml up -d loki promtail otel-collector jaeger
  loki:
    image: grafana/loki:2.9.0
    container_name: airdrop-loki
    profiles: ["observability"]
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/tmp/loki
    networks:
      - backend

  promtail:
    image: grafana/promtail:2.9.0
    container_name: airdrop-promtail
    profiles: ["observability"]
    volumes:
      - ./docker/loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/app:ro
      - ./docker/nginx/logs:/var/log/nginx:ro
    depends_on:
      - loki
    networks:
      - backend

  # 可选：OpenTelemetry Collector（P2）
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    container_name: airdrop-otel
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./configs/observability/otel/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter
    networks:
      - backend

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: airdrop-jaeger
    profiles: ["observability"]
    ports:
      - "16686:16686"
    networks:
      - backend

volumes:
  pgdata:
    driver: local
  # grafana-data:
  #   driver: local
  loki-data:
    driver: local

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true  # 后端网络不暴露到外部
