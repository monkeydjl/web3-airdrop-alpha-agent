# 生产环境 Docker Compose 配置
# 使用：docker compose -f docker-compose.prod.yml up -d --build
# 包含：nginx 前端 + FastAPI 后端 + PostgreSQL + 可选监控栈

services:
  # Nginx 反向代理（HTTP-only，TLS 由上游反向代理终止）
  nginx:
    image: nginx:alpine
    container_name: airdrop-nginx
    # 宿主机 18080 → 容器 80（避免与其它项目 80 冲突）
    ports:
      - "18080:80"
    volumes:
      - ./docker/nginx/nginx-http.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    networks:
      - frontend

  # Next.js 前端（主前端，宿主机 13002 → 容器 3002）
  frontend:
    build:
      context: .
      dockerfile: frontend-next/Dockerfile
    container_name: airdrop-frontend
    ports:
      - "13002:3002"
    environment:
      - PORT=3002
      - HOSTNAME=0.0.0.0
      # 前端通过 nginx 反代访问 API，无需直连后端
      - API_PROXY_TARGET=http://web:8002
    restart: unless-stopped
    networks:
      - frontend
      - backend

  # FastAPI 后端服务
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: airdrop-web
    expose:
      - "8002"
    environment:
      - PORT=8002
      - DATABASE_URL=postgresql://airdrop:${POSTGRES_PASSWORD}@db:5432/airdrop
      - API_KEY=${API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CRON_HOUR=8
      - CRON_MINUTE=0
      # 后端日志落盘（相对 /app/backend 工作目录），promtail 采集宿主 ./logs
      - LOG_FILE=${LOG_FILE:-logs/backend.log}
      # OpenTelemetry 链路追踪（配合 observability profile 的 otel-collector + jaeger）
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-airdrop-alpha}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-traceidratio}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-0.1}
    env_file:
      - .env
    volumes:
      - ./data:/app/backend/data
      - ./backups:/app/backups
      # 日志卷：宿主 ./logs 同时被 promtail 以 :ro 挂载采集（/var/log/app/*.log）
      - ./logs:/app/backend/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - frontend
      - backend

  # PostgreSQL 数据库
  db:
    image: postgres:15-alpine
    container_name: airdrop-db
    environment:
      - POSTGRES_DB=airdrop
      - POSTGRES_USER=airdrop
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups/pg:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airdrop"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:latest
    container_name: airdrop-prometheus
    # 宿主机 19090 → 容器 9090
    ports:
      - "19090:9090"
    volumes:
      - ./configs/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/observability/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - backend
      - monitoring

  # Alertmanager 告警通知（Telegram）
  alertmanager:
    image: prom/alertmanager:latest
    container_name: airdrop-alertmanager
    # 宿主机 19093 → 容器 9093
    ports:
      - "19093:9093"
    volumes:
      - ./configs/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        cp /etc/alertmanager/alertmanager.yml /tmp/alertmanager.yml
        sed -i "s/__TELEGRAM_BOT_TOKEN__/${TELEGRAM_BOT_TOKEN:-placeholder}/g" /tmp/alertmanager.yml
        sed -i "s/__TELEGRAM_CHAT_ID__/${TELEGRAM_CHAT_ID:-1}/g" /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    networks:
      - monitoring

  # Grafana 面板
  grafana:
    image: grafana/grafana:latest
    container_name: airdrop-grafana
    # 宿主机 13000 → 容器 3000
    ports:
      - "13000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      # Grafana 13 移除了经典面板文件的预置支持（GitHub #123607），
      # 禁用 v2 dashboard 特性开关以恢复文件预置加载（community workaround）
      - GF_FEATURE_TOGGLES_kubernetesDashboards=false
      - GF_FEATURE_TOGGLES_dashboardNewLayouts=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./configs/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - monitoring

  # 可选：Loki 日志集中采集（P2）
  # 使用 profile "observability" 默认不启动；启动命令：
  # docker compose --profile observability -f docker-compose.prod.yml up -d loki promtail otel-collector jaeger
  loki:
    image: grafana/loki:2.9.0
    container_name: airdrop-loki
    profiles: ["observability"]
    # 宿主机 13100 → 容器 3100
    ports:
      - "13100:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:2.9.0
    container_name: airdrop-promtail
    profiles: ["observability"]
    volumes:
      - ./docker/loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/app:ro
      - ./docker/nginx/logs:/var/log/nginx:ro
    depends_on:
      - loki
    networks:
      - monitoring

  # 可选：OpenTelemetry Collector（P2）
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    container_name: airdrop-otel
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./configs/observability/otel/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    # 宿主机 14317/14318/18889 → 容器 4317/4318/8889
    ports:
      - "14317:4317"   # OTLP gRPC
      - "14318:4318"   # OTLP HTTP
      - "18889:8889"   # Prometheus exporter
    networks:
      - backend   # web 通过 backend 网络上报 trace
      - monitoring  # non-internal 网络：允许宿主端口发布 + Prometheus 抓取

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: airdrop-jaeger
    profiles: ["observability"]
    # 宿主机 11686 → 容器 16686
    ports:
      - "11686:16686"
    networks:
      - backend   # 接收 otel-collector 的 trace
      - monitoring  # non-internal 网络：允许宿主访问 Jaeger UI

volumes:
  pgdata:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true  # 后端网络不暴露到外部
  monitoring:
    driver: bridge
