events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:8002;
    }

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;

        # 请求体大小限制
        client_max_body_size 10M;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 代理到后端
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS 一律交给后端处理（app/main.py 的 CORSMiddleware 按
            # CORS_ORIGINS 白名单回显 Origin，并在通配时自动关闭 credentials）。
            #
            # 原先这里是 `add_header Access-Control-Allow-Origin * always;` 外加
            # `if ($request_method = OPTIONS) { return 204; }`，两个问题：
            #   1. 任意网页都能自行通过预检，然后跨站调用 POST /api/v1/run、
            #      POST /api/v1/import/projects 等状态变更端点并读取响应；
            #   2. 它与后端发出的同名响应头重复，浏览器判定为畸形而整体拒绝，
            #      于是后端精心配置的白名单反而失效。
            # `always` 还会把这些头加到 401 响应上，让鉴权失败也可被跨站读取。
        }

        # 健康检查端点（直接返回，不经过后端）
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
