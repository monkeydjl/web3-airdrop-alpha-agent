# ──────────────────────────────────────────────
# Project Metadata & Tool Configuration
# ──────────────────────────────────────────────
# Web3 Airdrop Alpha Agent System
# 多智能体驱动的 Web3 早期项目识别与空投参与决策系统
# ──────────────────────────────────────────────

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web3-airdrop-alpha-agent"
version = "0.1.0"
description = "Multi-agent system for Web3 early-stage project identification and airdrop participation decisions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Web3 Airdrop Alpha Team", email = "dev@web3airdrop.dev" },
]
keywords = ["web3", "airdrop", "agent", "llm", "fastapi", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "detect-secrets>=1.4.0",
]
llm = [
    "openai>=1.30.0",
]
postgres = [
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.5.0",
    "respx>=0.21.0",
    "faker>=24.0.0",
]

[project.scripts]
airdrop = "app.main:main"

[project.urls]
Documentation = "https://github.com/web3-airdrop-alpha/web3-airdrop-alpha-agent/blob/main/README.md"
Source = "https://github.com/web3-airdrop-alpha/web3-airdrop-alpha-agent"
Issues = "https://github.com/web3-airdrop-alpha/web3-airdrop-alpha-agent/issues"

# ── setuptools ────────────────────────────────
[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

# ── ruff ──────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["backend", "tests"]

[tool.ruff.lint]
# E = pycodestyle errors
# F = pyflakes
# I = isort
# N = pep8-naming
# W = pycodestyle warnings
# UP = pyupgrade
# B = flake8-bugbear
# SIM = flake8-simplify
# ARG = flake8-unused-arguments
# RUF = ruff-specific rules
# S = bandit security rules (对齐 SECURITY.md §8.1：禁 eval/exec、禁硬编码密钥、禁弱哈希)
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "RUF", "S"]
ignore = [
    "E501",    # Line too long (handled by formatter)
    "RUF001",  # Full-width punctuation is valid in Chinese user-facing strings
    "RUF002",  # Full-width punctuation is valid in Chinese docstrings
    "RUF003",  # Full-width punctuation is valid in Chinese comments
    "S101",    # Use of assert (allowed in tests)
    "S603",    # subprocess call - check for execution of untrusted input
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S110", "ARG001", "ARG002"]  # Allow assert in tests and unused pytest fixtures
# 测试里的 "密钥" 全是本地假值（test-hmac-secret-… / "Bearer" 方案名），
# S105/S106 在此无意义；S110 允许清理阶段静默失败。
"backend/tests/**/*.py" = ["ARG001", "ARG002", "ARG005", "S105", "S106", "S110"]
# sqlite3.Row 的 `in` 检查的是**值**而不是键（'name' in row 为 False，'alpha' in row 为 True），
# 所以 `"col" in row.keys()` 是列存在性检查的唯一正确写法。照 SIM118 改成 `"col" in row`
# 会让所有可选列静默变成 None —— 这是行为破坏，不是风格问题。
"backend/app/routers/v1/collections.py" = ["SIM118"]
"backend/app/routers/v1/watchlist.py" = ["SIM118"]
"backend/scripts/*.py" = ["E402"]  # Scripts update sys.path before importing the local app package
"backend/app/config.py" = ["S104"]  # Containerized API defaults to listening on all interfaces
"backend/app/repository.py" = ["S608"]  # Dynamic SQL fragments use fixed columns and bound values
"backend/app/routers/v1/export_import.py" = ["B008"]  # FastAPI requires File calls in parameter defaults
"backend/app/routers/v1/opportunity.py" = ["B008"]  # FastAPI requires Depends calls in parameter defaults
"backend/app/routers/v1/projects.py" = ["B008"]  # FastAPI requires Query calls in parameter defaults
"backend/app/routers/v1/run.py" = ["B008"]  # FastAPI requires Body calls in parameter defaults

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 80

# ── mypy ──────────────────────────────────────
# ⚠️ 历史遗留的死配置：权威在 backend/pyproject.toml 的 [tool.mypy]（CI 的
# Type Check = cd backend + `mypy app --config-file pyproject.toml`，读那一份，
# 2026-08-28 已提升为 strict = true）。
# 本段只被 pre-commit 的 mypy hook（对单文件跑 + --ignore-missing-imports，
# 本就不可靠）读到；"从仓库根跑 mypy"会因缺 mypy_path 而 import-not-found。
# overrides 与 backend 保持一致（5 个缺 stub 的第三方库），只为避免读到旧口径。
# 彻底清理（删本段 + 修 pre-commit hook 指向 backend）留作后续小工程，另议。
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# 与 backend/pyproject.toml 的 [tool.mypy.overrides] 保持一致（5 个缺 stub 的第三方库）
module = ["apscheduler.*", "structlog.*", "pandas", "openpyxl.*", "opentelemetry.*"]
ignore_missing_imports = true

# ── pytest ────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=80",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "contract: Contract tests",
    "golden: Golden regression tests",
    "api: API tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pytest_asyncio",
]

# ── coverage ──────────────────────────────────
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
]

[tool.coverage.html]
directory = "htmlcov"
