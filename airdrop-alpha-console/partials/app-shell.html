<!-- ============================================================================
  共享片段 · gen-project-shell · 空投 Alpha 控制台应用外壳
  供 6 个同级叶子页面复制使用：仅允许替换 SLOT 注释对内的内容（pageTitle /
  pageSubtitle / pageActions / content），以及按 activeNavItem 注释说明设置
  data-active；其余结构与样式均为不可变外壳。
  外观 token 与 .alpha-* 工具类由叶子页面 <head> 注入；本片段不含
  <html> / <head> / <body>，仅内联一个 #critical-layout 关键布局样式块。
============================================================================ -->
<style id="critical-layout">
  /* ===== gen-project-shell · 关键布局（浅色专业主题 · 仅引用注入 token）===== */
  .app-shell,
  .app-shell *,
  .app-shell *::before,
  .app-shell *::after { box-sizing: border-box; }

  .app-shell {
    display: flex;
    min-height: 100vh;
    background: var(--background);
    color: var(--foreground);
    font-family: var(--font-sans);
  }

  /* ---------- 侧边栏（240px · 吸顶） ---------- */
  .app-sidebar {
    width: 240px;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 16px 12px;
    background: var(--sidebar);
    border-right: 1px solid var(--sidebar-border);
  }

  .app-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px 20px;
  }
  .app-brand-mark { display: block; flex-shrink: 0; }
  .app-brand-mark-bg { fill: var(--primary); }
  .app-brand-text { min-width: 0; }
  .app-brand-wordmark {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
    color: var(--foreground);
  }
  .app-brand-caption {
    margin-top: 2px;
    font-size: 11px;
    line-height: 1.3;
    color: var(--muted-foreground);
  }

  .app-nav { display: flex; flex-direction: column; gap: 2px; }

  .app-nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 36px;
    padding: 0 12px;
    border-radius: var(--radius-md);
    color: var(--muted-foreground);
    font-size: 13.5px;
    line-height: 1;
    text-decoration: none;
    white-space: nowrap;
    transition: background-color 150ms var(--ease-default),
                color 150ms var(--ease-default);
  }
  .app-nav-item:hover { background: var(--muted); color: var(--foreground); }
  .app-nav-item:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }
  .app-nav-item[data-active="true"] {
    background: var(--sidebar-accent);
    color: var(--sidebar-accent-foreground);
    font-weight: 500;
  }
  .app-nav-item[data-active="true"]:hover {
    background: var(--sidebar-accent);
    color: var(--sidebar-accent-foreground);
  }
  .app-nav-item [data-lucide] { width: 20px; height: 20px; flex-shrink: 0; }
  .app-nav-label { overflow: hidden; text-overflow: ellipsis; }

  .app-nav-badge {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    height: 18px;
    padding: 0 7px;
    border-radius: var(--radius-full);
    background: var(--alpha-brand-subtle);
    color: var(--alpha-brand-strong);
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 10.5px;
    line-height: 1;
  }

  .app-sidebar-spacer { flex: 1; }

  .app-sidebar-footer {
    border-top: 1px solid var(--sidebar-border);
    padding: 12px;
  }
  .app-api-health { display: flex; align-items: center; gap: 8px; }
  .app-api-dot {
    width: 8px;
    height: 8px;
    border-radius: var(--radius-full);
    background: var(--state-success);
    flex-shrink: 0;
  }
  .app-api-label { font-size: 12px; color: var(--muted-foreground); }
  .app-api-version {
    margin-left: auto;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    color: var(--muted-foreground);
  }
  .app-engine-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .app-engine-chip {
    display: inline-flex;
    align-items: center;
    height: 20px;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 10.5px;
    line-height: 1;
    color: var(--muted-foreground);
    white-space: nowrap;
  }

  /* ---------- 主区域 ---------- */
  .app-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .app-topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    height: 64px;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    background: var(--background);
  }
  .app-topbar-titles {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .app-page-title {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    line-height: 1.3;
    color: var(--foreground);
  }
  .app-page-subtitle {
    margin: 0;
    font-size: 12px;
    line-height: 1.4;
    color: var(--muted-foreground);
  }

  .app-topbar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .app-search {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 220px;
    height: 36px;
    padding: 0 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    color: var(--muted-foreground);
    transition: background-color 150ms var(--ease-default),
                color 150ms var(--ease-default);
  }
  .app-search:focus-within {
    border-color: var(--ring);
    box-shadow: 0 0 0 2px var(--ring);
  }
  .app-search [data-lucide] { width: 16px; height: 16px; flex-shrink: 0; }
  .app-search input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    font: inherit;
    font-size: 13px;
    color: var(--foreground);
  }
  .app-search input::placeholder { color: var(--muted-foreground); }

  .app-content {
    flex: 1;
    padding: 24px;
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
  }

  .app-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted-foreground);
  }

  /* ---------- 响应式：<960px 折叠为 64px 纯图标栏 ---------- */
  @media (max-width: 959px) {
    .app-sidebar { width: 64px; padding: 16px 8px; align-items: center; }
    .app-brand { padding: 8px 0 20px; }
    .app-brand-text { display: none; }
    .app-nav { width: 100%; align-items: center; }
    .app-nav-item { width: 40px; padding: 0; justify-content: center; gap: 0; }
    .app-nav-label,
    .app-nav-badge { display: none; }
    .app-sidebar-footer { width: 100%; padding: 12px 0 0; }
    .app-api-health { justify-content: center; }
    .app-api-label,
    .app-api-version { display: none; }
    .app-engine-badges { display: none; }
  }

  /* ---------- 降低动态效果 ---------- */
  @media (prefers-reduced-motion: reduce) {
    .app-shell *,
    .app-shell *::before,
    .app-shell *::after { transition: none !important; }
  }
</style>

<div class="app-shell">
  <aside class="app-sidebar">
    <div class="app-brand">

        <path d="M17 17.5a6.5 6.5 0 0 0-6.5-6.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>

    <nav class="app-nav" aria-label="主导航">

      </div>
    </div>
  </aside>

  <div class="app-main">
    <header class="app-topbar">
      <div class="app-topbar-titles">
        <!-- SLOT: pageTitle --><h1 class="app-page-title alpha-heading">页面标题</h1><!-- /SLOT: pageTitle -->
        <!-- SLOT: pageSubtitle --><p class="app-page-subtitle">页面副标题</p><!-- /SLOT: pageSubtitle -->
      </div>
      <div class="app-topbar-right">
        <label class="app-search">
          <i data-lucide="search"></i>

    <main class="app-content">

    <footer class="app-footer">

    </footer>
  </div>
</div>
