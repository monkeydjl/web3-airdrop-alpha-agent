# Prometheus 告警规则（适配后端实际指标名）
# 参考：backend/app/metrics.py

groups:
  - name: pipeline_alerts
    interval: 30s
    rules:
      - alert: PipelineConsecutiveFailures
        expr: |
          sum(increase(airdrop_pipeline_runs_total{status="failed"}[15m])) by (trigger) >= 2
        for: 1m
        labels:
          severity: critical
          component: pipeline
        annotations:
          summary: "Pipeline 连续失败（15 分钟内 ≥ 2 次）"
          description: "Trigger={{ $labels.trigger }} 的评分流水线在 15 分钟窗口内失败 2 次以上，可能存在系统性故障。"

      - alert: PipelineFailureRate
        expr: sum(rate(airdrop_pipeline_runs_total{status="failed"}[5m])) by (trigger) > 0
        for: 5m
        labels:
          severity: warning
          component: pipeline
        annotations:
          summary: "Pipeline 失败率告警"
          description: "Trigger={{ $labels.trigger }} 在 5 分钟内持续出现失败。"

      - alert: NoProjectsDiscovered
        expr: increase(airdrop_projects_scored_total[24h]) == 0
        for: 6h
        labels:
          severity: warning
          component: pipeline
        annotations:
          summary: "24 小时内未评分新项目"
          description: "数据采集或评分可能存在问题"

  - name: database_alerts
    interval: 60s
    rules:
      - alert: DBGaugeStale
        expr: time() - airdrop_db_projects_total > 86400
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "数据库指标未更新"
          description: "DB gauge 超过 24 小时未刷新"

  - name: llm_alerts
    interval: 30s
    rules:
      - alert: HighLLMErrorRate
        expr: rate(airdrop_llm_errors_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          component: llm
        annotations:
          summary: "LLM 请求错误"
          description: "最近 5 分钟内有 LLM 请求失败"

      # 这条与上面那条一起解决了一个隐患：airdrop_llm_errors_total 从注册那天起
      # 到 2026-08-24 之前**从未被递增过一次**，所以 HighLLMErrorRate 永远不会
      # 触发 —— 一条永不触发的告警看起来和"一切正常"完全一样，
      # 值班的人以为有人盯着。递增点补上后这条才真的在工作。

      - alert: LLMBudgetExhausted
        # 日预算耗尽 → LLM 调用被拒 → 项目解读退回规则引擎。
        # 这不是故障（是设计好的降级），所以是 warning 不是 critical，
        # 但必须能被看见：否则"解读质量突然变差"会被当成模型问题排查半天。
        expr: increase(airdrop_llm_budget_blocked_total{reason="budget_exceeded"}[15m]) > 0
        for: 1m
        labels:
          severity: warning
          component: llm
        annotations:
          summary: "LLM 日预算已耗尽，调用被拒并降级回规则引擎"
          description: "当日累计花费已达 LLM_DAILY_BUDGET_USD。这是设计好的降级，不是故障；要放开就调大预算并重启。"

      - alert: LLMBudgetLedgerUnavailable
        # 账本读不出来时策略是 fail closed（拒绝调用）—— 理由见 SECURITY.md §10.4。
        # 这个是**基础设施问题**（DB 锁 / 磁盘满 / 表缺失），不是预算配置问题，
        # 级别比"预算耗尽"高：它同时意味着数据库有麻烦。
        expr: increase(airdrop_llm_budget_blocked_total{reason="ledger_unavailable"}[15m]) > 0
        for: 1m
        labels:
          severity: critical
          component: llm
        annotations:
          summary: "LLM 预算账本读取失败，调用被 fail-closed 拒绝"
          description: "llm_spend_daily 表读不出来（DB 锁 / 磁盘满 / 表缺失）。先查数据库可写性，不要先怀疑预算配置。"

      - alert: LLMSpendNotRecorded
        # 钱花了但账没记上。这些花费**永远不会计入预算**，累积起来就是预算静默失效。
        # 这个指标是唯一能看到它的地方 —— 记账失败被有意做成不抛异常
        # （为记账失败而丢弃一个已付费的结果是纯亏损），代价就是它只在这里可见。
        expr: increase(airdrop_llm_spend_record_failures_total[1h]) > 0
        for: 5m
        labels:
          severity: critical
          component: llm
        annotations:
          summary: "LLM 花费未能写入账本，预算正在静默失效"
          description: "已发生的花费没有计入日累计，预算上限实际被抬高。查 llm.budget.record_failed 日志与数据库写入。"

  - name: system_alerts
    interval: 60s
    rules:
      - alert: HighAPIErrorRate
        expr: |
          sum(rate(airdrop_http_requests_total{status_class="5xx"}[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "API 错误率过高（5xx > 0.1/s）"
          description: "最近 5 分钟内 5xx 错误率持续超过 0.1 req/s，服务可能存在严重故障。"

      - alert: BackendDown
        expr: up{job="airdrop-backend"} == 0
        for: 1m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Backend 服务不可用"
          description: "Backend 已下线超过 1 分钟"