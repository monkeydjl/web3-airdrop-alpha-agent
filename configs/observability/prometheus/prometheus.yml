# Prometheus 配置
# 配置文件：configs/observability/prometheus/prometheus.yml
# 引用：docker-compose.prod.yml（Prometheus 服务）

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'airdrop-alpha'
    environment: 'production'

# 告警规则文件
rule_files:
  - 'alert_rules.yml'

# Alertmanager 配置
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      timeout: 3s
      api_version: v2

# 抓取配置
scrape_configs:
  # Backend API 指标（prometheus_client, /metrics）
  - job_name: 'airdrop-backend'
    static_configs:
      - targets: ['airdrop-web:8002']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']