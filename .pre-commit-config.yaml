# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: ['--fix', '--exit-non-zero-on-fix']
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-PyYAML]
        args: ['--ignore-missing-imports']

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json

  - repo: local
    hooks:
      - id: frontend-lint
        name: Frontend ESLint
        entry: bash -c 'cd frontend-next && npm run lint'
        language: system
        types: [file]
        files: ^frontend-next/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

      - id: frontend-typecheck
        name: Frontend TypeScript
        entry: bash -c 'cd frontend-next && npm run typecheck'
        language: system
        types: [file]
        files: ^frontend-next/.*\.(ts|tsx)$
        pass_filenames: false

      - id: check-terminology
        name: 术语回退检查（评分决策引擎）
        entry: python scripts/check_terminology.py
        language: system
        types: [file]
        files: \.(md|py|html|js|ts|tsx|json|yaml|yml|txt)$
        pass_filenames: true

      # 拦截编码损坏。仓库里已发现三种，成因同源（写回文件时没用 UTF-8，
      # 或用 errors='replace' 解码后又写回）：
      #   一型：3 字节中文字符丢第 3 字节 → 文件变成非法 UTF-8（3 个文档 1116 处）
      #   二型：整个中文字符变成半角 '?' → 文件**仍是合法 UTF-8**（API_SPEC.md 70 处）
      #   三型：字面 U+FFFD 替换符 → 同样合法（SYSTEM_DIRECTION_CHANGE.md 2 处）
      # 后两型更隐蔽：一型的检查完全看不见它们，二型在 git 历史里潜伏了 6 个提交。
      # 三型是写完二型检测后主动追问"还有没有别的形态"才发现的 ——
      # 检测判据的盲区就是损坏的藏身处。
      # 三型都是静默的 —— 文件照样能提交，只是中文变成 '?'。这道检查不让它再发生。
      - id: check-encoding
        name: 编码损坏检查（防止中文丢字）
        entry: python scripts/check_encoding.py
        language: system
        types: [file]
        files: \.(md|py|ts|tsx|js|jsx|json|yml|yaml|txt|ps1|bat|css|sql|toml|cfg|ini)$
        pass_filenames: true
