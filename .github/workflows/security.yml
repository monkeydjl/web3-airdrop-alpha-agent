# ──────────────────────────────────────────────
# Security Pipeline — Web3 Airdrop Alpha Agent System
# ──────────────────────────────────────────────
# 触发器: push（main）、每周定时、依赖文件变更
# 阶段: pip-audit → detect-secrets → Trivy scan → dependency review
# ──────────────────────────────────────────────

name: Security Scan

on:
  push:
    branches: [master, main]
    paths:
      - "backend/requirements*.txt"
      - "Dockerfile"
      - "docker/Dockerfile"
      - "frontend-next/package.json"
      - "frontend-next/package-lock.json"
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 6 * * 1" # 每周一 06:00 UTC

jobs:
  # ── Dependency Audit ──────────────────────
  dependency-audit:
    name: pip-audit (CVE Scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: |
          # requirements.txt 现已是精确锁定（==），pip-audit 能给出确定结论；
          # 此前全是浮动 >=，审计的是"某个可能版本"，结果不可复现。
          # requirements.lock.txt 分支保留：若将来改用 pip-compile 产出全量
          # 锁文件（含间接依赖），优先审计它。
          if [ -f backend/requirements.lock.txt ]; then
            pip-audit -r backend/requirements.lock.txt --strict
          else
            pip-audit -r backend/requirements.txt --strict
            pip-audit -r backend/requirements-dev.txt --strict
            # OTel 为可选依赖且未锁版本（见文件内说明），单独审计但不阻断
            if [ -f backend/requirements-otel.txt ]; then
              pip-audit -r backend/requirements-otel.txt || \
                echo "::warning::OTel 可选依赖审计未通过（未锁版本，不阻断构建）"
            fi
          fi
        continue-on-error: false

  # ── Secret Detection ──────────────────────
  secret-detection:
    name: Detect Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Scan for secrets
        run: |
          detect-secrets scan --baseline .secrets.baseline --exclude-files '\.env$|\.env\..*|package-lock\.json|.*\.db$|.*\.db\.bak-.*|\.git/|venv/|\.venv/|node_modules/|\.next/|\.worktrees/|\.pytest_tmp/|htmlcov/'
        continue-on-error: false

  # ── Container Image Scan ──────────────────
  container-scan:
    name: Docker Image Trivy Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: airdrop-alpha:scan-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      # 先出一份人能读的表格。此前只跑 SARIF 那一步，失败时日志里只有
      # `exit code 1`，没有任何漏洞明细 —— 这个 job 从 08-09 起就一直红着，
      # 却没人能说出是哪个 CVE。exit-code: 0 保证它只负责"让人看见"，
      # 判定仍由下面的 SARIF 步骤负责。
      - name: Trivy scan (human-readable, non-blocking)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: airdrop-alpha:scan-${{ github.sha }}
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "0"
          ignore-unfixed: true

      # 临时诊断：table 输出不含 PkgPath，而剩下 2 个 HIGH 的来源自相矛盾 ——
      # 镜像里 setuptools 是 84.0.0（Trivy 自己列出 setuptools-84.0.0.dist-info
      # 且 0 漏洞），却仍报 70.3.0；msgpack 更是完全没出现在任何 dist-info 路径里。
      # Trivy 同时警告 "Third-party SBOM may lead to inaccurate vulnerability
      # detection"，所以要先看清它究竟从哪个文件读到这两个版本，再决定怎么修。
      # 定位完这一步就删掉。
      - name: Trivy JSON (diagnose PkgPath)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: airdrop-alpha:scan-${{ github.sha }}
          format: "json"
          output: "trivy-diag.json"
          severity: "HIGH,CRITICAL"
          exit-code: "0"
          ignore-unfixed: true

      - name: Show PkgPath of remaining findings
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("trivy-diag.json"))
          for res in d.get("Results", []):
              vulns = res.get("Vulnerabilities") or []
              if not vulns:
                  continue
              print(f'--- Target: {res.get("Target")}  Type: {res.get("Type")}  Class: {res.get("Class")}')
              for v in vulns:
                  print(f'  {v.get("VulnerabilityID"):24} {v.get("PkgName"):14} '
                        f'installed={v.get("InstalledVersion"):12} fixed={v.get("FixedVersion")}')
                  print(f'    PkgPath   = {v.get("PkgPath")}')
                  print(f'    PkgID     = {v.get("PkgID")}')
                  ident = v.get("PkgIdentifier") or {}
                  print(f'    PURL      = {ident.get("PURL")}')
                  print(f'    Layer     = {(v.get("Layer") or {}).get("DiffID")}')
          PY

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: airdrop-alpha:scan-${{ github.sha }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # ── Dependency Review (PR only) ──────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
