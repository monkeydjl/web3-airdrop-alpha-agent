# ──────────────────────────────────────────────
# Security Pipeline — Web3 Airdrop Alpha Agent System
# ──────────────────────────────────────────────
# 触发器: push（main）、每周定时、依赖文件变更
# 阶段: pip-audit → detect-secrets → Trivy scan → dependency review
# ──────────────────────────────────────────────

name: Security Scan

on:
  push:
    branches: [master, main]
    paths:
      - "backend/requirements*.txt"
      - "Dockerfile"
      - "docker/Dockerfile"
      - "frontend-next/package.json"
      - "frontend-next/package-lock.json"
      # 改这个 workflow 自己也要能触发它 —— 否则修完扫描逻辑或权限
      # 都没法在 push 事件下验证，只能等每周一的定时任务。
      # 实测踩过：`security-events: write` 那次修完，因为路径过滤不含
      # 本文件，合并后压根没跑起来。
      - ".github/workflows/security.yml"
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 6 * * 1" # 每周一 06:00 UTC
  # 手动触发。这个 job 红了 13 天却无人能复现，部分原因就是只能等
  # push/定时 —— 想验证一次修复得先凑出一个符合路径过滤的提交。
  workflow_dispatch:

jobs:
  # ── Dependency Audit ──────────────────────
  dependency-audit:
    name: pip-audit (CVE Scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: |
          # requirements.txt 现已是精确锁定（==），pip-audit 能给出确定结论；
          # 此前全是浮动 >=，审计的是"某个可能版本"，结果不可复现。
          # requirements.lock.txt 分支保留：若将来改用 pip-compile 产出全量
          # 锁文件（含间接依赖），优先审计它。
          if [ -f backend/requirements.lock.txt ]; then
            pip-audit -r backend/requirements.lock.txt --strict
          else
            pip-audit -r backend/requirements.txt --strict
            pip-audit -r backend/requirements-dev.txt --strict
            # OTel 为可选依赖且未锁版本（见文件内说明），单独审计但不阻断
            if [ -f backend/requirements-otel.txt ]; then
              pip-audit -r backend/requirements-otel.txt || \
                echo "::warning::OTel 可选依赖审计未通过（未锁版本，不阻断构建）"
            fi
          fi
        continue-on-error: false

  # ── Secret Detection ──────────────────────
  secret-detection:
    name: Detect Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Scan for secrets
        run: |
          detect-secrets scan --baseline .secrets.baseline --exclude-files '\.env$|\.env\..*|package-lock\.json|.*\.db$|.*\.db\.bak-.*|\.git/|venv/|\.venv/|node_modules/|\.next/|\.worktrees/|\.pytest_tmp/|htmlcov/'
        continue-on-error: false

  # ── Container Image Scan ──────────────────
  container-scan:
    name: Docker Image Trivy Scan
    runs-on: ubuntu-latest
    # 上传 SARIF 到 code scanning 需要 `security-events: write`。
    #
    # 仓库的默认 workflow 令牌权限是 `read`（实测
    # `actions/permissions/workflow` → `default_workflow_permissions: read`），
    # 这是安全的默认值，不该为了这一个步骤把整仓改成 write。
    # 所以在这个 job 上按最小必要显式声明。
    #
    # 为什么之前没暴露：`pull_request` 事件下 upload-sarif 能成功上传
    # （PR #4 上的同一个 job 全绿，analyses 里确实有 refs/pull/4/merge 的记录），
    # 但 `push` 事件下同一步骤报
    # `Resource not accessible by integration`。合并 PR #4 触发 push 之后，
    # Trivy 扫描本身已经 0 漏洞通过，job 却因为上传失败仍判 failure ——
    # 也就是说这道闸门此前 13 天的红灯里，混着两个独立故障：
    # 真实漏洞（已修）与权限不足（此处修）。前者掩盖了后者。
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: airdrop-alpha:scan-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      # 先出一份人能读的表格。此前只跑 SARIF 那一步，失败时日志里只有
      # `exit code 1`，没有任何漏洞明细 —— 这个 job 从 08-09 起就一直红着，
      # 却没人能说出是哪个 CVE。exit-code: 0 保证它只负责"让人看见"，
      # 判定仍由下面的 SARIF 步骤负责。
      - name: Trivy scan (human-readable, non-blocking)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: airdrop-alpha:scan-${{ github.sha }}
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "0"
          ignore-unfixed: true

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: airdrop-alpha:scan-${{ github.sha }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # ── Dependency Review (PR only) ──────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
