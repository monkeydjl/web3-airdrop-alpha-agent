# ──────────────────────────────────────────────
# Security Pipeline — Web3 Airdrop Alpha Agent System
# ──────────────────────────────────────────────
# 触发器: push（main）、每周定时、依赖文件变更
# 阶段: pip-audit → detect-secrets → Trivy scan → dependency review
# ──────────────────────────────────────────────

name: Security Scan

on:
  push:
    branches: [master, main]
    paths:
      - "backend/requirements*.txt"
      - "Dockerfile"
      - "docker/Dockerfile"
      - "frontend-next/package.json"
      - "frontend-next/package-lock.json"
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 6 * * 1" # 每周一 06:00 UTC

jobs:
  # ── Dependency Audit ──────────────────────
  dependency-audit:
    name: pip-audit (CVE Scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: |
          # requirements.txt 现已是精确锁定（==），pip-audit 能给出确定结论；
          # 此前全是浮动 >=，审计的是"某个可能版本"，结果不可复现。
          # requirements.lock.txt 分支保留：若将来改用 pip-compile 产出全量
          # 锁文件（含间接依赖），优先审计它。
          if [ -f backend/requirements.lock.txt ]; then
            pip-audit -r backend/requirements.lock.txt --strict
          else
            pip-audit -r backend/requirements.txt --strict
            pip-audit -r backend/requirements-dev.txt --strict
            # OTel 为可选依赖且未锁版本（见文件内说明），单独审计但不阻断
            if [ -f backend/requirements-otel.txt ]; then
              pip-audit -r backend/requirements-otel.txt || \
                echo "::warning::OTel 可选依赖审计未通过（未锁版本，不阻断构建）"
            fi
          fi
        continue-on-error: false

  # ── Secret Detection ──────────────────────
  secret-detection:
    name: Detect Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Scan for secrets
        run: |
          detect-secrets scan --baseline .secrets.baseline --exclude-files '\.env$|\.env\..*|package-lock\.json|.*\.db$|.*\.db\.bak-.*|\.git/|venv/|\.venv/|node_modules/|\.next/|\.worktrees/|\.pytest_tmp/|htmlcov/'
        continue-on-error: false

  # ── Container Image Scan ──────────────────
  container-scan:
    name: Docker Image Trivy Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: airdrop-alpha:scan-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: airdrop-alpha:scan-${{ github.sha }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # ── Dependency Review (PR only) ──────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
