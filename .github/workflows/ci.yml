# ──────────────────────────────────────────────
# CI/CD Pipeline — Web3 Airdrop Alpha Agent System
# ──────────────────────────────────────────────
# 触发器: push（master/main/feat/**/fix/**/docs/**）、pull_request（master/main）
# 阶段: lint → test (unit + contract + golden + api) → build docker → smoke test
# ──────────────────────────────────────────────

name: CI

on:
  push:
    branches: [master, main, 'feat/**', 'fix/**', 'docs/**']
  pull_request:
    branches: [master, main]

env:
  PYTHON_VERSION: "3.12"
  PYTHON_VERSION_FILE: "backend/requirements.txt"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Phase 1: Code Quality ─────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 装锁定版本的 dev 依赖（含 ruff），不再散装 `pip install ruff` ——
          # 散装等于不锁版本，本地绿 CI 红多半由此而来
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run ruff check
        run: python -m ruff check .
        continue-on-error: false

      - name: Run ruff format check
        run: python -m ruff format --check .
        continue-on-error: false

      # 连接卫生守卫（CONVENTIONS.md §13.3）：app/ 下建连必须统一走
      # app.db.connection_scope，禁止裸 with get_connection() 与手写
      # finally close 模式（17.1.26 借用连接被 close 的事故回归防线）。
      # 纯标准库 AST 实现，无需额外安装。
      - name: Connection hygiene guard
        run: python scripts/check_connection_hygiene.py
        continue-on-error: false

      # 测试建库守卫：测试文件直连 DB_PATH 却无自救建库路径（init_db /
      # create_app / 自建表 / settings.db_path 重定向）时失败。防止新的
      # 隐式依赖混进来——全新 checkout 上「单跑一个文件」必红。
      - name: Test DB bootstrap guard
        run: python scripts/check_test_db_bootstrap.py
        continue-on-error: false

  # ── Phase 2: Tests ───────────────────────
  test:
    name: Full Backend Test Suite
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pytest / pytest-cov 已锁定在 requirements-dev.txt 里，不再散装安装
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run full backend test suite
        run: >-
          pytest tests -q
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80
          -W error::DeprecationWarning
          -W error::ResourceWarning
          -W error::pytest.PytestUnraisableExceptionWarning
        continue-on-error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml

  # ── Phase 2b: Coverage Gate ──────────────
  #
  # 为什么单独拆一个 job：`master` 的分支保护把 `Coverage Gate` 列为必过检查，
  # 但仓库里从来没有任何 job 叫这个名字 —— 覆盖率门槛只以 `--cov-fail-under=80`
  # 参数的形式藏在上面 test 那步里面。结果这个必过检查永远处于 pending，
  # 任何 PR 的 mergeStateStatus 恒为 BLOCKED（dependabot PR #3 就这样卡了 5 天）。
  #
  # 两个修法里选了「让这个名字真实存在」而不是「从必过列表删掉它」：
  # 后者是放宽门禁，前者不是。
  #
  # 这个 job 不重跑测试（那要 7 分半），只下载 test 阶段已上传的 coverage.xml
  # 并独立断言行覆盖率。它与 `--cov-fail-under` 不是重复劳动：
  # 参数写在命令行里，哪天被人调低或删掉不会有任何提示；这个 job 把阈值
  # 固化成一道独立的、名字可见的闸门。
  coverage-gate:
    name: Coverage Gate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Assert line coverage >= 80%
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          THRESHOLD = 80.0

          root = ET.parse("coverage.xml").getroot()
          # coverage.py 的 Cobertura 输出把总行覆盖率放在根节点的 line-rate（0~1）
          rate = root.get("line-rate")
          if rate is None:
              print("::error::coverage.xml 里没有 line-rate 属性，无法判定覆盖率")
              sys.exit(1)

          pct = float(rate) * 100
          covered = root.get("lines-covered")
          valid = root.get("lines-valid")
          print(f"行覆盖率: {pct:.2f}%  ({covered}/{valid} 行)  门槛: {THRESHOLD}%")

          if pct + 1e-9 < THRESHOLD:
              print(f"::error::覆盖率 {pct:.2f}% 低于门槛 {THRESHOLD}%")
              sys.exit(1)
          print("✅ 覆盖率门槛通过")
          PY

  # ── Phase 2c: Test DB Isolation Gate ─────
  #
  # 背景：`check_test_db_bootstrap.py`（lint 阶段）是静态 AST 守卫，只认
  # 「直连默认库」的信号；经 service 层间接用库的测试文件它完全看不见
  # （CONVENTIONS §13.4 已知边界）。这类「间接触库」文件此前既无守卫、
  # 也不在任何 PR 门禁里 —— tests/test_roi_simulator.py 于 2026-09-29
  # conftest 改为每轮删库后变红，却一路溜到全量套件才暴露，就是这么发生的。
  # 本 job 把「间接触库」桶接进 PR 门禁，作为这道共享盲区的第二道防线。
  #
  # 为什么是 ci.yml 的 job，而不是给 test-db-isolation.yml 加 paths: 触发器：
  # 分支保护只认 job 名，而带 paths 过滤的 workflow 在不匹配的 PR 上根本
  # 不会触发 → required check 永远停在 pending（`Coverage Gate` 名字不存在
  # 那次卡了 dependabot PR #3 五天，就是同一类坑）。所以本 job 必须
  # **每次都报**：先跑一步便宜的 git diff 判断改动是否落在关键路径，命中才
  # 装依赖跑酸测，不命中就快速收盘。要登记到分支保护的 required check 名是
  # `Test DB Isolation Gate`。
  #
  # 为什么只跑 indirect 桶：全量三桶约 104 文件 / 8-10 分钟（test_interactions
  # 单文件 107s），不适合每个 PR。间接触库是共享盲区里风险最高的一桶 ——
  # 零静态信号，唯一防线就是它。灰区桶（34 文件）保留了直连信号、静态守卫
  # 至少能看见，继续由 test-db-isolation.yml 手动/定期全量跑。
  test-db-isolation:
    name: Test DB Isolation Gate
    needs: lint
    runs-on: ubuntu-latest
    # 65 文件串行（本地约 4-6 分钟）；上限是给 CI 慢机器的余量，非预期耗时。
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      # fetch-depth: 0：关键路径判定要对 base 做三路 git diff，浅克隆里
      # 没有 PR base 的历史，merge-base 求不出来。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 这一步**必须无条件运行**：它是「本 job 每次都报」的实现。给它加上
      # if 条件，命中路径之外的分支上 job 会提前跳过，required check 就会
      # 挂在 pending —— 正是上面记的那个坑。
      - name: Detect DB-relevant changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            git fetch --no-tags --quiet origin "$BASE_REF"
            range="origin/$BASE_REF...HEAD"
          elif git rev-parse --verify -q HEAD~1 >/dev/null; then
            # push 场景已知取舍：HEAD~1...HEAD 只看最后一个提交，一次推多个
            # 提交时中间提交的关键路径改动可能漏判。方向是 fail-safe 的（漏跑
            # 酸测而非误报），且 push 到受保护分支前必经 PR（三点 diff 覆盖
            # 全部改动），故接受；直接推多提交到非保护分支时留意这一点。
            range="HEAD~1...HEAD"
          else
            range="HEAD"
          fi
          changed=$(git diff --name-only --diff-filter=ACMR $range || true)
          echo "本次改动文件："
          printf '%s\n' "$changed"
          # 关键路径：app/（模块依赖图变化会制造新的间接触库文件）、
          # tests/（新增/修改测试）、scripts/（守卫与酸测脚本自身），
          # 以及本 workflow 文件（改门禁本身也要能验证它）。
          if printf '%s\n' "$changed" | grep -Eq '^(backend/(app|tests|scripts)/|\.github/workflows/ci\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice
        if: steps.detect.outputs.relevant != 'true'
        run: echo "✅ 改动不在关键路径（backend/{app,tests,scripts} + ci.yml 本身），跳过空库酸测"

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        if: steps.detect.outputs.relevant == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        if: steps.detect.outputs.relevant == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # 只跑间接触库桶：静态守卫看不见、自身也无直连信号，唯一防线。
      # 红 = 某测试在全新空库上隐式依赖默认库残留数据；修测试，不是改酸测。
      - name: Run indirect-bucket acid test
        if: steps.detect.outputs.relevant == 'true'
        run: python scripts/verify_test_db_isolation.py --bucket indirect
        continue-on-error: false

  # ── Phase 3: Docker Build ────────────────
  docker-build:
    name: Docker Build Check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: airdrop-alpha:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Smoke test — health check
        run: |
          set -euo pipefail
          container=airdrop-smoke
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$container" -p 8002:8002 airdrop-alpha:ci-${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8002/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1

  # ── Phase 4: Type Check ──────────────────
  type-check:
    name: Type Check (mypy)
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # mypy 已锁定在 requirements-dev.txt 里，不再散装安装 ——
          # mypy 小版本间的检查结果会变，散装会让 CI 结果不可复现
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run mypy
        run: mypy app --config-file pyproject.toml

  # ── Phase 5: Frontend CI ─────────────────
  frontend:
    name: Frontend Lint & Build
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 与本地开发机对齐（node v24.18.1）。此前写 "22"，而前端单测靠
          # Node 原生执行 TypeScript（类型擦除）来跑 `.ts` 源文件 —— 这个能力
          # 在 22.x 上是要开关的、在 24 上默认可用。本地 24 能过、CI 22 不能过
          # 是最难查的一类失败，所以直接把两边钉成同一个大版本。
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      # 前端此前完全没有单测。lib/download.ts 里全是解析别人给的字符串
      # （HTTP 头、错误响应体、文件名），这类代码失败时不抛错，只会静默地
      # 把一个错值当对值用下去 —— 正是必须被测试钉住的地方。
      - name: Run frontend unit tests
        run: npm test

      - name: Run build
        run: npm run build

      - name: Run npm audit
        run: npm audit --audit-level=high
