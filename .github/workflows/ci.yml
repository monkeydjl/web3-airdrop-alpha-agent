# ──────────────────────────────────────────────
# CI/CD Pipeline — Web3 Airdrop Alpha Agent System
# ──────────────────────────────────────────────
# 触发器: push（master/main/feat/**/fix/**/docs/**）、pull_request（master/main）
# 阶段: lint → test (unit + contract + golden + api) → build docker → smoke test
# ──────────────────────────────────────────────

name: CI

on:
  push:
    branches: [master, main, 'feat/**', 'fix/**', 'docs/**']
  pull_request:
    branches: [master, main]

env:
  PYTHON_VERSION: "3.12"
  PYTHON_VERSION_FILE: "backend/requirements.txt"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Phase 1: Code Quality ─────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 装锁定版本的 dev 依赖（含 ruff），不再散装 `pip install ruff` ——
          # 散装等于不锁版本，本地绿 CI 红多半由此而来
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run ruff check
        run: python -m ruff check .
        continue-on-error: false

      - name: Run ruff format check
        run: python -m ruff format --check .
        continue-on-error: false

  # ── Phase 2: Tests ───────────────────────
  test:
    name: Full Backend Test Suite
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pytest / pytest-cov 已锁定在 requirements-dev.txt 里，不再散装安装
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run full backend test suite
        run: >-
          pytest tests -q
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80
          -W error::DeprecationWarning
          -W error::ResourceWarning
          -W error::pytest.PytestUnraisableExceptionWarning
        continue-on-error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml

  # ── Phase 2b: Coverage Gate ──────────────
  #
  # 为什么单独拆一个 job：`master` 的分支保护把 `Coverage Gate` 列为必过检查，
  # 但仓库里从来没有任何 job 叫这个名字 —— 覆盖率门槛只以 `--cov-fail-under=80`
  # 参数的形式藏在上面 test 那步里面。结果这个必过检查永远处于 pending，
  # 任何 PR 的 mergeStateStatus 恒为 BLOCKED（dependabot PR #3 就这样卡了 5 天）。
  #
  # 两个修法里选了「让这个名字真实存在」而不是「从必过列表删掉它」：
  # 后者是放宽门禁，前者不是。
  #
  # 这个 job 不重跑测试（那要 7 分半），只下载 test 阶段已上传的 coverage.xml
  # 并独立断言行覆盖率。它与 `--cov-fail-under` 不是重复劳动：
  # 参数写在命令行里，哪天被人调低或删掉不会有任何提示；这个 job 把阈值
  # 固化成一道独立的、名字可见的闸门。
  coverage-gate:
    name: Coverage Gate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Assert line coverage >= 80%
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          THRESHOLD = 80.0

          root = ET.parse("coverage.xml").getroot()
          # coverage.py 的 Cobertura 输出把总行覆盖率放在根节点的 line-rate（0~1）
          rate = root.get("line-rate")
          if rate is None:
              print("::error::coverage.xml 里没有 line-rate 属性，无法判定覆盖率")
              sys.exit(1)

          pct = float(rate) * 100
          covered = root.get("lines-covered")
          valid = root.get("lines-valid")
          print(f"行覆盖率: {pct:.2f}%  ({covered}/{valid} 行)  门槛: {THRESHOLD}%")

          if pct + 1e-9 < THRESHOLD:
              print(f"::error::覆盖率 {pct:.2f}% 低于门槛 {THRESHOLD}%")
              sys.exit(1)
          print("✅ 覆盖率门槛通过")
          PY

  # ── Phase 3: Docker Build ────────────────
  docker-build:
    name: Docker Build Check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: airdrop-alpha:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Smoke test — health check
        run: |
          set -euo pipefail
          container=airdrop-smoke
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$container" -p 8002:8002 airdrop-alpha:ci-${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8002/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1

  # ── Phase 4: Type Check ──────────────────
  type-check:
    name: Type Check (mypy)
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # mypy 已锁定在 requirements-dev.txt 里，不再散装安装 ——
          # mypy 小版本间的检查结果会变，散装会让 CI 结果不可复现
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run mypy
        run: mypy app --config-file pyproject.toml

  # ── Phase 5: Frontend CI ─────────────────
  frontend:
    name: Frontend Lint & Build
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 与本地开发机对齐（node v24.18.1）。此前写 "22"，而前端单测靠
          # Node 原生执行 TypeScript（类型擦除）来跑 `.ts` 源文件 —— 这个能力
          # 在 22.x 上是要开关的、在 24 上默认可用。本地 24 能过、CI 22 不能过
          # 是最难查的一类失败，所以直接把两边钉成同一个大版本。
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      # 前端此前完全没有单测。lib/download.ts 里全是解析别人给的字符串
      # （HTTP 头、错误响应体、文件名），这类代码失败时不抛错，只会静默地
      # 把一个错值当对值用下去 —— 正是必须被测试钉住的地方。
      - name: Run frontend unit tests
        run: npm test

      - name: Run build
        run: npm run build

      - name: Run npm audit
        run: npm audit --audit-level=high
