# ──────────────────────────────────────────────
# CI/CD Pipeline — Web3 Airdrop Alpha Agent System
# ──────────────────────────────────────────────
# 触发器: push（任意分支）、pull_request（main）
# 阶段: lint → test (unit + contract + golden) → build docker → smoke test
# ──────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'docs/**']
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  PYTHON_VERSION_FILE: "backend/requirements.txt"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Phase 1: Code Quality ─────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi

      - name: Run ruff check
        run: ruff check . --output-format=github
        continue-on-error: false

      - name: Run ruff format check
        run: ruff format --check .
        continue-on-error: false

  # ── Phase 2: Tests ───────────────────────
  test:
    name: Tests (Unit + Contract + Golden)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi
          pip install pytest pytest-cov

      - name: Run unit tests
        run: pytest tests/unit -v --cov=backend/app --cov-report=term --cov-report=xml
        continue-on-error: false

      - name: Run contract tests
        run: pytest tests/contracts -v
        continue-on-error: false

      - name: Run golden regression tests
        run: pytest tests/golden -v
        continue-on-error: false

      - name: Check coverage threshold
        run: |
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree=ET.parse('coverage.xml'); print(tree.getroot().attrib['line-rate'])")
          THRESHOLD=0.80
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage $COVERAGE below threshold $THRESHOLD"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE meets threshold $THRESHOLD"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ── Phase 3: API Integration Tests ───────
  api-test:
    name: API Integration Tests
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi
          pip install pytest httpx

      - name: Run API tests
        run: pytest tests/api -v -x
        continue-on-error: false

  # ── Phase 4: Docker Build ────────────────
  docker-build:
    name: Docker Build Check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: airdrop-alpha:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Smoke test — health check
        run: |
          docker run --rm -d --name airdrop-smoke -p 8000:8000 airdrop-alpha:ci-${{ github.sha }}
          sleep 5
          curl -f http://localhost:8000/health || exit 1
          docker stop airdrop-smoke

  # ── Phase 5: Type Check (optional, V2+) ─
  type-check:
    name: Type Check (mypy)
    needs: lint
    runs-on: ubuntu-latest
    if: false  # 启用条件：backend/ 目录存在且有 mypy 配置
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi
          pip install mypy

      - name: Run mypy
        run: mypy backend/app --strict
