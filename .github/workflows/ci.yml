# ──────────────────────────────────────────────
# CI/CD Pipeline — Web3 Airdrop Alpha Agent System
# ──────────────────────────────────────────────
# 触发器: push（任意分支）、pull_request（main）
# 阶段: lint → test (unit + contract + golden + api) → build docker → smoke test
# ──────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'docs/**']
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"
  PYTHON_VERSION_FILE: "backend/requirements.txt"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Phase 1: Code Quality ─────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run ruff check
        run: python -m ruff check .
        continue-on-error: false

      - name: Run ruff format check
        run: python -m ruff format --check .
        continue-on-error: false

  # ── Phase 2: Tests ───────────────────────
  test:
    name: Full Backend Test Suite
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest pytest-cov

      - name: Run full backend test suite
        run: >-
          pytest tests -q
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80
          -W error::DeprecationWarning
          -W error::ResourceWarning
          -W error::pytest.PytestUnraisableExceptionWarning
        continue-on-error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml

  # ── Phase 3: Docker Build ────────────────
  docker-build:
    name: Docker Build Check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: airdrop-alpha:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Smoke test — health check
        run: |
          docker run --rm -d --name airdrop-smoke -p 8002:8002 airdrop-alpha:ci-${{ github.sha }}
          sleep 5
          curl -f http://localhost:8002/health || exit 1
          docker stop airdrop-smoke

  # ── Phase 4: Type Check (optional, V2+) ─
  type-check:
    name: Type Check (mypy)
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    if: false  # 启用条件：backend/ 目录存在且有 mypy 配置
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install mypy

      - name: Run mypy
        run: mypy app --strict
