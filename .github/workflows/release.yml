# ──────────────────────────────────────────────
# Release Pipeline — Web3 Airdrop Alpha Agent System
# ──────────────────────────────────────────────
# 触发器: git tag v*（语义化版本）
# 阶段: test gate → build → push to registry → deploy to demo
# ──────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - "v*" # v1.0.0, v1.1.0, v2.0.0, etc.

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Test Gate ────────────────────────────
  #
  # 为什么 release 要自己再跑一遍检查：ci.yml 的 push 触发器只匹配分支
  # （master/main/feat/**/fix/**/docs/**），tag push 不会触发 CI —— 没有这道门，
  # 发布镜像的那个 commit 可能从未通过任何测试（2026-08-30 审核修复）。
  # 检查项与 ci.yml 对齐（ruff / mypy strict / 全量 pytest）；前端不在列是因为
  # 下面的 Docker 构建本身就要在前端容器里跑 next build，前端坏了发布直接失败。
  test-gate:
    name: Release Test Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run ruff check
        run: python -m ruff check .

      - name: Run ruff format check
        run: python -m ruff format --check .

      - name: Run mypy (strict)
        run: mypy app --config-file pyproject.toml

      - name: Run full backend test suite
        run: >-
          pytest tests -q
          -W error::DeprecationWarning
          -W error::ResourceWarning
          -W error::pytest.PytestUnraisableExceptionWarning

  # ── Build & Publish ──────────────────────
  release:
    name: Build & Publish Release
    needs: test-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/tags/{0}', 'v*') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 不吃 gha 缓存，与 security.yml 的结论一致：apt 层缓存会把带已知
          # CVE 的旧基础层带进发布镜像（CVE-2026-14456 案例）。发布镜像
          # 生命周期最长，宁可每次全量构建。
          no-cache: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: "spdx-json"
          output-file: "sbom-${{ github.ref_name }}.spdx.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.ref_name }}
          path: "sbom-*.spdx.json"

  # ── Smoke Test (Deploy to Demo) ──────────
  deploy-demo:
    name: Deploy to Demo Environment
    needs: release
    runs-on: ubuntu-latest
    if: false # 启用时配置 SSH/Deploy keys
    steps:
      - name: Deploy via SSH
        run: |
          ssh deploy@demo-server 'bash -se' <<'EOF'
          cd /opt/airdrop-alpha
          docker compose pull
          docker compose up -d --force-recreate
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8002/health; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs backend
          exit 1
          EOF
