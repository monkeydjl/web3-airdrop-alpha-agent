<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Airdrop Alpha Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --farm: #16a34a;
            --watch: #d97706;
            --ignore: #6b7280;
            --risk-high: #dc2626;
            --risk-medium: #d97706;
            --risk-low: #16a34a;
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0,0,0,.08);
            --radius: 12px;
            --font: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --card: #1e293b;
            --text-main: #e2e8f0;
            --text-secondary: #94a3b8;
            --border: #334155;
            --shadow: 0 1px 3px rgba(0,0,0,.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
        }

        a { color: var(--primary); text-decoration: none; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Navbar */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--card);
            box-shadow: var(--shadow);
            border-bottom: 1px solid var(--border);
        }

        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .nav-links {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .nav-link {
            padding: 8px 14px;
            border-radius: 8px;
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            border: none;
            background: transparent;
            font-size: 0.95rem;
        }

        .nav-link:hover, .nav-link.active {
            background: var(--bg);
            color: var(--primary);
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text-main);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .mobile-menu-btn { display: none; }

        /* Views */
        .view { display: none; animation: fadeIn 0.2s ease; }
        .view.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .page-title { font-size: 1.75rem; font-weight: 700; }
        .page-subtitle { color: var(--text-secondary); font-size: 0.95rem; margin-top: 4px; }

        /* Cards */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 20px;
            border-left: 5px solid var(--accent);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 8px;
            color: var(--text-main);
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .chart-container {
            position: relative;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        /* Filter bar */
        .filter-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 20px;
        }

        .filter-bar input, .filter-bar select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text-main);
            font-size: 0.9rem;
            min-width: 140px;
        }

        .filter-bar input[type="number"] { min-width: 80px; }

        .btn {
            padding: 9px 16px;
            border-radius: 8px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        /* Project grid */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .project-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 18px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            border-top: 4px solid var(--accent);
        }

        .project-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,0,0,.1);
        }

        .project-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 10px;
        }

        .project-card-name {
            font-weight: 700;
            font-size: 1.1rem;
            word-break: break-word;
        }

        .project-card-meta {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .project-card-score {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 10px;
        }

        .score-number { font-size: 1.75rem; font-weight: 700; }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #fff;
        }

        .badge-FARM { background: var(--farm); }
        .badge-WATCH { background: var(--watch); }
        .badge-IGNORE { background: var(--ignore); }

        .badge-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            text-transform: none;
        }

        .reason-preview {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Detail */
        .detail-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .detail-title-wrap { flex: 1; }
        .detail-title { font-size: 1.6rem; font-weight: 700; }

        .detail-hero {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 24px;
            align-items: center;
            margin-bottom: 24px;
        }

        .score-ring {
            width: 160px;
            height: 160px;
        }

        .score-ring circle.bg { fill: none; stroke: var(--border); stroke-width: 10; }
        .score-ring circle.value {
            fill: none;
            stroke: var(--accent);
            stroke-width: 10;
            stroke-linecap: round;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dasharray 0.5s ease;
        }
        .score-ring text { fill: var(--text-main); font-weight: 700; }

        .confidence-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .warning-icon {
            color: var(--watch);
            cursor: help;
        }

        .reason-list {
            list-style: none;
            margin-top: 12px;
        }

        .reason-list li {
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
            display: flex;
            gap: 8px;
        }

        .reason-list li:last-child { border-bottom: none; }

        .reason-prefix {
            font-weight: 700;
            width: 18px;
            flex-shrink: 0;
        }

        .reason-prefix.pos { color: var(--farm); }
        .reason-prefix.neg { color: var(--risk-high); }
        .reason-prefix.warn { color: var(--watch); }

        .agent-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 24px;
        }

        .agent-panel h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .kv-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .kv-row:last-child { border-bottom: none; }
        .kv-key { color: var(--text-secondary); }
        .kv-value { font-weight: 500; }

        .progress-bar {
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 6px;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 4px;
        }

        /* Insights */
        .insights-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
        }

        .trend-up { color: var(--risk-high); }
        .trend-down { color: var(--farm); }
        .trend-flat { color: var(--text-secondary); }

        .risky-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .risky-item:last-child { border-bottom: none; }

        .mini-distribution {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
            font-size: 0.9rem;
        }

        .mini-bar {
            flex: 1;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .mini-fill {
            height: 100%;
            border-radius: 4px;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state h3 {
            color: var(--text-main);
            margin-bottom: 8px;
        }

        /* Loading */
        .skeleton {
            background: linear-gradient(90deg, var(--border) 25%, var(--bg) 50%, var(--border) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
            border-radius: 8px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Toast */
        #toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            padding: 12px 18px;
            border-radius: 8px;
            background: var(--card);
            color: var(--text-main);
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
            border-left: 4px solid var(--primary);
            animation: slideIn 0.2s ease;
            min-width: 240px;
        }

        .toast.error { border-left-color: var(--risk-high); }
        .toast.success { border-left-color: var(--farm); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Responsive */
        @media (max-width: 1023px) {
            .projects-grid { grid-template-columns: repeat(2, 1fr); }
            .charts-grid { grid-template-columns: 1fr; }
            .insights-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 639px) {
            .container { padding: 16px; }
            .nav-links { display: none; position: absolute; top: 64px; left: 0; right: 0; background: var(--card); flex-direction: column; padding: 12px; box-shadow: var(--shadow); }
            .nav-links.open { display: flex; }
            .mobile-menu-btn { display: inline-flex; }
            .projects-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr; }
            .detail-hero { grid-template-columns: 1fr; text-align: center; }
            .agent-grid { grid-template-columns: 1fr; }
            .page-header { flex-direction: column; align-items: flex-start; }
        }

        .feedback-panel {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .feedback-stats {
            background: var(--bg);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .feedback-stats strong { color: var(--text); }

        .feedback-signals {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }

        .feedback-signal {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s, border-color 0.2s;
        }

        .feedback-signal:hover { background: var(--bg); }
        .feedback-signal input { accent-color: var(--primary); }

        .feedback-field {
            margin-bottom: 16px;
        }

        .feedback-field label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text);
        }

        .feedback-field textarea,
        .feedback-field select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font: inherit;
            resize: vertical;
        }

        .feedback-field textarea:focus,
        .feedback-field select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .feedback-item {
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }

        .feedback-item:last-child { border-bottom: none; }

    </style>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <div class="logo">🚀 Airdrop Alpha</div>
            <div class="nav-links" id="navLinks">
                <button class="nav-link active" data-view="dashboard">Dashboard</button>
                <button class="nav-link" data-view="insights">Insights</button>
                <button class="icon-btn" id="themeToggle" title="切换主题">🌙</button>
            </div>
            <button class="icon-btn mobile-menu-btn" id="mobileMenuBtn" aria-label="菜单">☰</button>
        </div>
    </nav>

    <main class="container">
        <!-- Dashboard -->
        <section id="dashboard-view" class="view active">
            <div class="page-header">
                <div>
                    <div class="page-title">Dashboard</div>
                    <div class="page-subtitle">已评分项目概览与重点机会</div>
                </div>
                <button class="btn btn-primary" id="runPipelineBtn" onclick="runAutoPipeline()">
                    ▶ 运行自动采集评分
                </button>
            </div>

            <div id="dashboardContent">
                <div class="stats-grid" id="statsGrid"></div>

                <div class="charts-grid">
                    <div class="card">
                        <div class="section-title">Label 分布</div>
                        <div class="chart-container">
                            <canvas id="labelChart"></canvas>
                        </div>
                    </div>
                    <div class="card">
                        <div class="section-title">赛道分布</div>
                        <div class="chart-container">
                            <canvas id="sectorChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="section-title">项目列表</div>
                    <div class="filter-bar">
                        <select id="filterLabel" onchange="onFilterChange()">
                            <option value="">全部 Label</option>
                            <option value="FARM">FARM</option>
                            <option value="WATCH">WATCH</option>
                            <option value="IGNORE">IGNORE</option>
                        </select>
                        <select id="filterSector" onchange="onFilterChange()">
                            <option value="">全部赛道</option>
                        </select>
                        <input type="number" id="filterMinScore" min="0" max="100" placeholder="最低分数" oninput="debouncedFilter()">
                        <input type="text" id="filterSearch" placeholder="搜索项目名称..." oninput="debouncedFilter()">
                        <select id="filterSort" onchange="onFilterChange()">
                            <option value="score_desc">分数 ↓</option>
                            <option value="score_asc">分数 ↑</option>
                            <option value="name_asc">名称 A-Z</option>
                        </select>
                    </div>
                    <div id="projectsGrid"></div>
                </div>
            </div>
        </section>

        <!-- Insights -->
        <section id="insights-view" class="view">
            <div class="page-header">
                <div>
                    <div class="page-title">Insights</div>
                    <div class="page-subtitle">叙事热度、团队风险与分布趋势</div>
                </div>
            </div>
            <div class="insights-grid" id="insightsGrid"></div>
        </section>

        <!-- Project Detail -->
        <section id="detail-view" class="view">
            <div class="detail-header">
                <button class="btn btn-outline" onclick="goBack()">← 返回</button>
            </div>
            <div id="detailContent"></div>
        </section>
    </main>

    <div id="toast-container"></div>

    <script>
        // ── Config ─────────────────────────────────────────────
        const API_BASE = (window.location.hostname === 'localhost' && window.location.port === '3002')
            ? 'http://localhost:8002/api/v1'
            : (window.location.origin + '/api/v1');

        const COLORS = {
            FARM: '#16a34a',
            WATCH: '#d97706',
            IGNORE: '#6b7280',
            riskHigh: '#dc2626',
            riskMedium: '#d97706',
            riskLow: '#16a34a',
            primary: '#2563eb',
            border: '#e2e8f0',
        };

        const state = {
            projects: [],
            allProjects: [],
            insights: null,
            filters: { label: '', sector: '', minScore: '', q: '', sort: 'score_desc' },
            charts: {},
            currentProjectId: null,
            theme: 'light',
        };

        // ── Helpers ────────────────────────────────────────────
        function $(id) { return document.getElementById(id); }

        function getCssVar(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        function showToast(message, type = 'info') {
            const container = $('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        async function apiFetch(path, options = {}) {
            const url = `${API_BASE}${path}`;
            try {
                const response = await fetch(url, options);
                const data = await response.json();
                if (!response.ok || !data.ok) {
                    const msg = data.error?.message || `请求失败 (${response.status})`;
                    throw new Error(msg);
                }
                return data.data;
            } catch (err) {
                if (err.name === 'TypeError' && err.message.includes('fetch')) {
                    throw new Error('无法连接后端，请确认服务已启动');
                }
                throw err;
            }
        }

        function debounce(fn, ms) {
            let t;
            return (...args) => {
                clearTimeout(t);
                t = setTimeout(() => fn(...args), ms);
            };
        }

        const debouncedFilter = debounce(onFilterChange, 300);

        function labelClass(label) {
            return ['FARM','WATCH','IGNORE'].includes(label) ? label : 'IGNORE';
        }

        function riskColor(level) {
            return level === 'high' ? COLORS.riskHigh : (level === 'medium' ? COLORS.watch : COLORS.farm);
        }

        function reasonPrefix(reason) {
            const r = (reason || '').toLowerCase();
            const pos = ['strong','credible','high','good','positive','early','hot','active','funding','growth','doxxed','signal'];
            const neg = ['risk','low','missing','no ','uncertain','unknown','poor','weak','late','decline','anonymous','failed','wash'];
            if (pos.some(k => r.includes(k))) return { cls: 'pos', text: '+' };
            if (neg.some(k => r.includes(k))) return { cls: 'neg', text: '-' };
            return { cls: 'warn', text: '!' };
        }

        // ── Theme ───────────────────────────────────────────────
        function initTheme() {
            const saved = localStorage.getItem('aa-theme');
            state.theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            applyTheme();
            $('themeToggle').addEventListener('click', toggleTheme);
        }

        function applyTheme() {
            document.documentElement.setAttribute('data-theme', state.theme);
            $('themeToggle').textContent = state.theme === 'dark' ? '☀️' : '🌙';
            updateChartColors();
        }

        function toggleTheme() {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('aa-theme', state.theme);
            applyTheme();
        }

        // ── Routing ─────────────────────────────────────────────
        function initRouting() {
            window.addEventListener('hashchange', route);
            document.querySelectorAll('.nav-link').forEach(btn => {
                btn.addEventListener('click', () => {
                    const view = btn.dataset.view;
                    location.hash = view === 'dashboard' ? '' : view;
                });
            });
            $('mobileMenuBtn').addEventListener('click', () => {
                $('navLinks').classList.toggle('open');
            });
            route();
        }

        function route() {
            const hash = location.hash.replace('#', '');
            let view = 'dashboard';
            let projectId = null;

            if (hash.startsWith('project/')) {
                view = 'detail';
                projectId = hash.split('/')[1];
            } else if (hash === 'insights') {
                view = 'insights';
            }

            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            $(`${view}-view`).classList.add('active');

            document.querySelectorAll('.nav-link').forEach(el => {
                el.classList.toggle('active', el.dataset.view === view);
            });
            $('navLinks').classList.remove('open');

            if (view === 'dashboard') loadDashboard();
            else if (view === 'insights') loadInsights();
            else if (view === 'detail' && projectId) loadProjectDetail(projectId);
        }

        // ── Dashboard ───────────────────────────────────────────

            renderDashboardSkeleton();

                const [projectsData, insightsData] = await Promise.all([
                    apiFetch('/projects?page_size=1000'),
                    apiFetch('/insights'),
                ]);
                state.projects = projectsData.projects || [];
                state.insights = insightsData;
                populateSectorFilter();
                renderDashboard();
            } catch (err) {
                showToast(err.message, 'error');
                $('statsGrid').innerHTML = '';

            }

            $('statsGrid').innerHTML = Array(4).fill('<div class="skeleton" style="height:100px"></div>').join('');
            $('projectsGrid').innerHTML = Array(6).fill('<div class="skeleton" style="height:140px"></div>').join('');
        }

        function populateSectorFilter() {
            const sectors = [...new Set(state.projects.map(p => p.sector).filter(Boolean))].sort();
            const select = $('filterSector');
            const current = select.value;
            select.innerHTML = '<option value="">全部赛道</option>' +
                sectors.map(s => `<option value="${s}">${s}</option>`).join('');
            select.value = current;
        }

        function onFilterChange() {
            state.filters = {
                label: $('filterLabel').value,
                sector: $('filterSector').value,
                minScore: $('filterMinScore').value,
                q: $('filterSearch').value.trim().toLowerCase(),
                sort: $('filterSort').value,
            };
            renderProjectGrid();
        }

        function getFilteredProjects() {
            let list = [...state.projects];
            if (state.filters.label) list = list.filter(p => p.label === state.filters.label);
            if (state.filters.sector) list = list.filter(p => p.sector === state.filters.sector);
            if (state.filters.minScore) list = list.filter(p => (p.score || 0) >= parseInt(state.filters.minScore, 10));
            if (state.filters.q) list = list.filter(p => (p.name || '').toLowerCase().includes(state.filters.q));

            const [sortBy, sortOrder] = state.filters.sort.split('_');
            list.sort((a, b) => {
                if (sortBy === 'score') {
                    return sortOrder === 'asc' ? (a.score - b.score) : (b.score - a.score);
                }
                return sortOrder === 'asc'
                    ? (a.name || '').localeCompare(b.name || '')
                    : (b.name || '').localeCompare(a.name || '');
            });
            return list;
        }

        async function runAutoPipeline() {
            const btn = $('runPipelineBtn');
            if (!btn) return;
            btn.disabled = true;
            btn.textContent = '采集中...';
            try {
                // 1. 获取并触发所有已启用采集源
                const sourcesData = await apiFetch('/collections/sources');
                const sources = (sourcesData.sources || []).filter(s => s.is_enabled);
                if (sources.length === 0) {
                    showToast('没有启用的采集源，请检查 .env 配置', 'warning');
                    return;
                }

                let collected = 0;
                let failedSources = 0;
                for (const s of sources) {
                    try {
                        const result = await apiFetch(`/collections/${s.source_id}/trigger`, {
                            method: 'POST',
                        });
                        collected += (result.items_collected || 0);
                    } catch (err) {
                        failedSources += 1;
                        console.warn(`采集源 ${s.source_id} 失败:`, err.message);
                    }
                }

                if (collected > 0) {
                    showToast(`采集完成：${collected} 条原始数据`, 'success');
                } else if (failedSources === sources.length) {
                    showToast('所有采集源均失败，请检查网络或 API key', 'error');
                    return;
                } else {
                    showToast('暂无新数据，已启用源可能未返回结果', 'info');
                }

                // 2. 对采集到的原始数据运行评分 pipeline
                btn.textContent = '评分中...';
                const data = await apiFetch('/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enable_llm: false }),
                });
                showToast(`Pipeline 完成：${data.scored_count || 0} 个项目`, 'success');
                await loadDashboard();
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '▶ 运行自动采集评分';
            }
        }

        async function loadFeedbackStats(projectId) {

                const result = await apiFetch(`/feedback/${projectId}`);
                const data = result.data || {};
                const signals = data.signals || {};
                const items = (data.items || []).slice(0, 3);
                const signalText = Object.entries(signals).map(([k, v]) => `${k}: ${v}`).join(' · ') || '暂无反馈';
                const itemsHtml = items.map(item => `
                    <div class="feedback-item">
                        <strong>${item.signal}</strong> · ${item.created_at || ''}
                        ${item.note ? `<br><span style="color:var(--text-secondary)">${escapeHtml(item.note)}</span>` : ''}
                    </div>
                `).join('');
                statsEl.innerHTML = `
                    <div><strong>反馈统计</strong> · 共 ${data.count || 0} 条 · ${signalText}</div>
                    ${itemsHtml ? `<div style="margin-top:10px;">${itemsHtml}</div>` : ''}
                `;
            } catch (err) {
                statsEl.innerHTML = `<span style="color:var(--danger)">加载反馈失败：${escapeHtml(err.message)}</span>`;
            }
        }

        function onSignalChange() {
            const selected = document.querySelector('input[name="signal"]:checked');
            const field = $('correctLabelField');
            if (field) {
                field.style.display = selected && selected.value === 'wrong_label' ? 'block' : 'none';
            }
        }

        async function submitFeedback(event) {
            event.preventDefault();
            const projectId = state.currentProjectId;
            if (!projectId) return;

            const selected = document.querySelector('input[name="signal"]:checked');
            const signal = selected ? selected.value : 'useful';
            const noteEl = $('feedbackNote');
            const note = noteEl ? noteEl.value.trim() : '';

            let finalNote = note;
            if (signal === 'wrong_label') {
                const labelEl = $('correctLabel');
                const correctLabel = labelEl ? labelEl.value : '';
                finalNote = (note ? note + ' · ' : '') + `correct_label=${correctLabel}`;
            }

            const btn = $('feedbackSubmitBtn');
            if (btn) {
                btn.disabled = true;
                btn.textContent = '提交中...';
            }

            try {
                await apiFetch('/feedback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        project_id: projectId,
                        signal: signal,
                        note: finalNote || null,
                    })
                });
                showToast('反馈已提交，谢谢', 'success');
                if (noteEl) noteEl.value = '';
                await loadFeedbackStats(projectId);
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '提交反馈';
                }
            }
        }

            if (e.target && e.target.name === 'signal') {

            const labelDist = Object.entries(data.label_counts || {}).sort((a, b) => b[1] - a[1]).map(([k, v]) => {
                const pct = (v / labelTotal) * 100;
                return `
                    <div class="mini-distribution">
                        <span style="width:60px; font-weight:500;">${k}</span>
                        <div class="mini-bar"><div class="mini-fill" style="width:${pct}%; background:${COLORS[k] || COLORS.primary}"></div></div>
                        <span style="width:40px; text-align:right;">${v}</span>
                    </div>`;
            }).join('');

            const sectorTotal = Object.values(data.sector_counts || {}).reduce((a, b) => a + b, 0) || 1;
            const sectorDist = Object.entries(data.sector_counts || {}).sort((a, b) => b[1] - a[1]).map(([k, v]) => {
                const pct = (v / sectorTotal) * 100;
                return `
                    <div class="mini-distribution">
                        <span style="width:60px; font-weight:500;">${escapeHtml(k)}</span>
                        <div class="mini-bar"><div class="mini-fill" style="width:${pct}%; background:${COLORS.primary}"></div></div>
                        <span style="width:40px; text-align:right;">${v}</span>
                    </div>`;
            }).join('');

            $('insightsGrid').innerHTML = `
                <div class="card">
                    <div class="section-title">🔥 最热叙事排行</div>
                    ${hottest || '<div style="color:var(--text-secondary)">暂无数据</div>'}
                </div>
                <div class="card">
                    <div class="section-title">Label 分布</div>
                    ${labelDist || '<div style="color:var(--text-secondary)">暂无数据</div>'}
                    <div class="section-title" style="margin-top:20px;">赛道分布</div>
                    ${sectorDist || '<div style="color:var(--text-secondary)">暂无数据</div>'}
                </div>
                <div class="card" style="grid-column:1/-1;">
                    <div class="section-title">⚠️ 高风险团队聚类</div>
                    ${risky || '<div style="color:var(--text-secondary)">暂无高风险团队</div>'}
                </div>
            `;
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // ── Init ────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            initRouting();
        });
    </script>
</body>
</html>
