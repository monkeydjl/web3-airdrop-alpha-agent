[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
# 版本 / requires-python 与根 pyproject.toml 保持一致。此前两份分别写
# 1.0.0/>=3.10 与 0.1.0/>=3.11，而 Docker 镜像用 python:3.12、CI 也是 3.12，
# 三处口径不一致会让"支持哪个 Python"这个问题没有答案。
name = "web3-airdrop-alpha"
version = "0.1.0"
description = "Multi-agent Web3 airdrop opportunity identification system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.35.6",
    "pydantic==2.10.8",
    "pydantic-settings==2.7.3",
    "defusedxml==0.7.1",
    "structlog==25.1.0",
    "python-multipart>=0.0.31",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "psycopg[binary]>=3.2",
    "alembic>=1.13.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-instrumentation-sqlite3>=0.49b0",
    "opentelemetry-instrumentation-psycopg>=0.49b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio==1.0.0",
    "pytest-cov==6.0.1",
    "httpx==0.29.2",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    # 覆盖率下限与根 pyproject / CI 对齐。此前本文件没有这一行，而 pytest 从
    # backend/ 运行时用的正是本文件——等于本地跑 pytest 完全不校验覆盖率，
    # 只有 CI 显式传 --cov-fail-under=80 才拦得住。
    "--cov-fail-under=80",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.mypy]
# ⚠️ 这个值必须等于 `requires-python` 的**下限**（3.11），不是运行时镜像的版本。
#
# 2026-08-24 实测的理由（写下来是因为直觉会指向相反方向）：
#
#   探针 `itertools.batched(...)`（Python 3.12 新增的标准库 API）
#     · mypy --python-version 3.11 → error: Module has no attribute "batched" ✅ 拦住
#     · mypy --python-version 3.12 → Success, no issues                      ❌ 放过
#     · ruff --target-version py311 → All checks passed                      ❌ 放过
#     · 真 3.11.9 解释器            → AttributeError: module 'itertools' has no attribute 'batched'
#
# ruff 的 `target-version = "py311"`（根 pyproject）只拦 3.12 专属**语法**
# （实测能拦 PEP 695 的 `type X = int` 与 `def f[T]()`），
# **拦不住标准库 API 的版本差** —— 那是类型检查器的活。
#
# 所以之前写 3.12 的后果是：`requires-python = ">=3.11"` 这句承诺
# **没有任何一道门在守**。一段用了 3.12 新 API 的代码会通过全部 CI，
# 然后在任何 3.11 环境上抛 AttributeError —— 而且是运行时才抛，
# 报错信息完全不提 Python 版本。
#
# 把它设成下限是"多拦"而不是"少拦"：在 3.12 上跑 3.11 的检查完全安全，
# 反之才危险。改这一行时如果 CI 红了，说明真有代码用了 3.12 专属 API ——
# 那时该改的是代码，或者把 `requires-python` 一起提到 >=3.12。
python_version = "3.11"
mypy_path = "."

# 2026-08-25 从"宽松口径"提升到 strict（owner 决策，立项修完 374 个错误）。
# 此前这一堆开关是 false/true 的混合，效果等于"让 mypy 跑起来但基本不设防"
# —— 类型检查器没纪律，和没装的门锁一样：CI 绿，但什么都拦不住。
# strict = true 等价于同时打开 disallow_untyped_defs / disallow_untyped_calls /
# disallow_incomplete_defs / warn_return_any / no_implicit_reexport /
# warn_unused_ignores 等一整套。收紧后若 CI 红，是代码该改，不是开关回退。
strict = true
# 与根 pyproject.toml 的 [tool.mypy] 对齐：strict 套餐不含下面两个，
# 根配置额外开了，这里也补上（warn_unreachable 抓死代码，warn_redundant_casts
# 抓多余的 cast）。保持两份口径一致，避免"根说严、backend 说松"再次分裂。
warn_unreachable = true
warn_redundant_casts = true

# 只豁免"已装依赖但没配 stub"的第三方库的 import 检查，
# 项目内 app/ 的类型纪律一条都不豁免。
[[tool.mypy.overrides]]
module = ["apscheduler.*", "structlog.*", "pandas", "openpyxl.*", "opentelemetry.*", "defusedxml.*"]
ignore_missing_imports = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
