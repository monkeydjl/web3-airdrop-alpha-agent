server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: airdrop-alpha-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: airdrop-alpha
          service: backend
          __path__: /var/log/app/*.log

  - job_name: airdrop-alpha-nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: airdrop-alpha
          service: nginx
          __path__: /var/log/nginx/*.log
