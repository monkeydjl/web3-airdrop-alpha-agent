server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: airdrop-alpha-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: airdrop-alpha
          service: backend
          __path__: /var/log/app/*.log

  - job_name: airdrop-alpha-nginx
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/?airdrop-nginx'
        action: keep
      - target_label: job
        replacement: airdrop-alpha
      - target_label: service
        replacement: nginx
