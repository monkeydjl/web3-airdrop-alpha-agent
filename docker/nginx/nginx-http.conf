# ──────────────────────────────────────────────
# Nginx — Web3 Airdrop Alpha Agent System (HTTP-only)
# ──────────────────────────────────────────────
# 用途：生产级反向代理（无 TLS，适合内网/反向代理层终止 TLS）
# 如需 HTTPS，请使用 nginx.conf（TLS 版本）并挂载证书
# ──────────────────────────────────────────────

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"x_forwarded_for":"$http_x_forwarded_for"'
    '}';
    access_log /var/log/nginx/access.json json;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;

    upstream backend {
        server web:8002 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3002 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        server_name _;

        # ── Next.js 前端 ──────────────────
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # Next.js 静态资源缓存
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                proxy_pass http://frontend;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # ── API：必须经 Next.js，不能直连后端 ──
        #
        # ⚠️ 这里 `proxy_pass` 指向 **frontend**，不是 backend。看着绕，但绕不掉：
        # 浏览器不持有任何后端凭据，凭据由 `frontend-next/proxy.ts` 在服务端按
        # 路径分档注入（管理端前缀 → X-API-Key，其余 → 匿名 Bearer token）。
        #
        # 这一行曾经写的是 `proxy_pass http://backend`，后果是整套鉴权在生产
        # 拓扑下**完全没接线**：浏览器的 API 请求从 nginx 直接进后端，Next 的
        # proxy 永不执行，于是 `API_KEY` 非空时全站 401、页面空白 —— 而本地
        # `npm run dev` 一切正常（那时请求确实经过 Next），差异只在生产暴露。
        #
        # 反过来说，若把这行改回 backend 又刚好把 `API_KEY` 留空，就变成另一种
        # 坏法：能用，但整个后端零鉴权对公网敞开。两种坏法都不报错。
        #
        # 代价是 API 多一跳（nginx → Next → 后端）。已确认这一跳**不影响限流**：
        # Next 转发用 httpxy，`setupOutgoing` 原样复制请求头且未启用 `xfwd`
        # （`node_modules/next/dist/server/lib/router-utils/proxy-request.js`
        # 只额外设 `x-forwarded-host`），所以 XFF 段数不变，
        # `TRUSTED_PROXY_COUNT` 仍按 nginx 这一层算 1。
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # 刻意不配 proxy_next_upstream：upstream 只有一个 Next 实例，
            # 重试没有别的目标可去，只会把写请求（POST /run 等）重复打一遍。

            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # ── 健康检查 ────────────────────
        location /health {
            limit_req zone=api burst=5;
            proxy_pass http://backend/health;
            proxy_http_version 1.1;
        }

        # ── Prometheus 指标：只对内网开放 ──
        #
        # `/metrics` 在后端 `app/auth.py::PUBLIC_PREFIXES` 里（Prometheus 抓取端
        # 不方便带凭据），所以**它到哪儿就在哪儿免鉴权** —— 从公网转发过来就是
        # 把内部指标直接公开：项目数量、pipeline 成败次数、LLM 调用量与花费、
        # 各采集源错误率。这些不是秘密但是免费的侦察材料，也能反推运营规模。
        #
        # 而 Prometheus **根本不需要**这条路径：它在 `backend` 网络里直连
        # `airdrop-web:8002`（`configs/observability/prometheus/prometheus.yml:29`
        # 的 target 就是容器名），从来没经过 nginx。
        #
        # 于是这里**直接拒绝**，不做网段白名单。
        #
        # 白名单在这个拓扑下不可靠：`allow`/`deny` 判的是 `$remote_addr`，
        # 而 Docker 若启用 userland-proxy（Docker Desktop 默认），外部客户端的
        # 源地址会被改写成网桥网关 `172.17.0.1` —— 正好落进 `172.16.0.0/12`，
        # 于是"只放行内网"的规则对**全体外部访客**放行。一条看起来收紧了、
        # 实际什么都没挡住的规则比没有规则更糟。
        #
        # 要看指标就走 Grafana（有登录），或从 `backend` 网络里直连
        # `airdrop-web:8002/metrics`。
        location /metrics {
            access_log off;
            return 403;
        }
    }
}
