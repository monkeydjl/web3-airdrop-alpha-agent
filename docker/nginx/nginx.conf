# ──────────────────────────────────────────────
# Nginx — Web3 Airdrop Alpha Agent System
# ──────────────────────────────────────────────
# 用途：生产级反向代理 + 静态前端托管 + TLS 终止
# ──────────────────────────────────────────────

# 全局
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── 基础优化 ──────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── 日志 ──────────────────────────────
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"x_forwarded_for":"$http_x_forwarded_for"'
    '}';
    access_log /var/log/nginx/access.json json;
    error_log  /var/log/nginx/error.log warn;

    # ── Gzip ──────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript image/svg+xml;

    # ── 安全头 ────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── 速率限制 ──────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;

    # ── 上游 ──────────────────────────────
    upstream backend {
        server web:8002 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ── Server: HTTP (重定向到 HTTPS) ────
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Server: HTTPS ─────────────────────
    server {
        listen 443 ssl http2 default_server;
        server_name _;

        # TLS（证书通过 volume 挂载）
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── 静态前端 ──────────────────────
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;

            # 静态资源缓存
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # ── API 反向代理 ──────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # 超时
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # 错误时尝试下一个 upstream
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;

            # 缓冲
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # ── 健康检查（绕过 API 限流） ────
        location /health {
            limit_req zone=api burst=5;
            proxy_pass http://backend/health;
            proxy_http_version 1.1;
        }

        # ── Prometheus 指标 ────────────────
        location /metrics {
            limit_req zone=api burst=5;
            proxy_pass http://backend/metrics;
            proxy_http_version 1.1;
        }

        # ── 错误页面 ──────────────────────
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
    }
}
