# ──────────────────────────────────────────────
# Nginx — Web3 Airdrop Alpha Agent System
# ──────────────────────────────────────────────
# 用途：TLS 终止 + 反向代理**样板**（当前没有任何 compose 引用它）
# ──────────────────────────────────────────────
#
# ⚠️ **这份不是在跑的配置。** 实际生效的是同目录 `nginx-http.conf`
# （`docker-compose.prod.yml:30` 挂载它），HTTP-only，TLS 由上游反代终止。
# 本文件保留作为"自己终止 TLS"时的起点，用之前必须先补两件事：
#
#   1. `ssl_certificate` 指向的 `/etc/nginx/ssl/` 需要真挂进来 ——
#      当前没有任何 compose 挂载它，直接用会 nginx 启动失败。
#   2. 下面 `location /` 是静态托管（`root /usr/share/nginx/html`），
#      但本仓前端是 Next.js **standalone**（`output: 'standalone'`），
#      产出的是一个 Node 服务而不是可挂载的静态目录 ——
#      SSR 页面、API rewrite、`proxy.ts` 的凭据注入都得有那个进程才成立。
#      要用这份配置，`location /` 与 `location /api/` 都得改成
#      `proxy_pass http://frontend`（照 `nginx-http.conf` 的写法）。
#
# 已同步的部分：`/api/` 与 `/metrics` 两处按 `nginx-http.conf` 的结论改过，
# 免得有人照这份部署时又踩一遍"鉴权没接线"和"指标裸奔"。

# 全局
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── 基础优化 ──────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── 日志 ──────────────────────────────
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"x_forwarded_for":"$http_x_forwarded_for"'
    '}';
    access_log /var/log/nginx/access.json json;
    error_log  /var/log/nginx/error.log warn;

    # ── Gzip ──────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript image/svg+xml;

    # ── 安全头 ────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── 速率限制 ──────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;

    # ── 上游 ──────────────────────────────
    upstream backend {
        server web:8002 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Next.js 前端。`/api/` 也走这里（见下方 location /api/ 的说明）。
    # 缺这个块的话 nginx 启动就报 `host not found in upstream "frontend"` ——
    # 属于会立刻发现的错，但既然 `/api/` 已经指过来，就得一起补上。
    upstream frontend {
        server frontend:3002 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ── Server: HTTP (重定向到 HTTPS) ────
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Server: HTTPS ─────────────────────
    server {
        listen 443 ssl http2 default_server;
        server_name _;

        # TLS（证书通过 volume 挂载）
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── 静态前端 ──────────────────────
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;

            # 静态资源缓存
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # ── API：必须经 Next.js，不能直连后端 ──
        #
        # 凭据由 `frontend-next/proxy.ts` 在服务端按路径分档注入，浏览器不持有
        # 任何后端凭据。直连 backend 会让那套注入完全不执行 → `API_KEY` 非空时
        # 全站 401。理由与实测见 `nginx-http.conf` 同一位置的长注释。
        #
        # ⚠️ 用本文件前记得同时把上面的 `location /` 也改成 proxy_pass 到
        # frontend（见文件头第 2 条）—— 只改这里的话前端页面仍然起不来。
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # 超时
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # 刻意不配 proxy_next_upstream：upstream 只有一个 Next 实例，
            # 重试没有别的目标可去，只会把写请求重复打一遍。

            # 缓冲
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # ── 健康检查（绕过 API 限流） ────
        location /health {
            limit_req zone=api burst=5;
            proxy_pass http://backend/health;
            proxy_http_version 1.1;
        }

        # ── Prometheus 指标：只对内网开放 ──
        #
        # `/metrics` 在后端 `PUBLIC_PREFIXES` 里，**到哪儿就在哪儿免鉴权**，
        # 从公网转发过来等于公开内部指标（项目数、pipeline 成败、LLM 花费、
        # 各采集源错误率）。而 Prometheus 走内网直连容器，不需要这条路径。
        # 刻意不用 `allow` 网段白名单：Docker userland-proxy 会把外部源地址
        # 改写成 `172.17.0.1`，那种白名单等于对全体外部访客放行。
        location /metrics {
            access_log off;
            return 403;
        }

        # ── 错误页面 ──────────────────────
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
    }
}
