version: '3.8'

services:
  # ══════════════════════════════════════════════════════════════
  # Backend API Service
  # ══════════════════════════════════════════════════════════════
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: airdrop-alpha-backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8002}:8002"
    volumes:
      # 持久化数据库
      - ./data:/app/data
      # 持久化日志
      - ./logs:/app/logs
    # 镜像里没有 .env（.dockerignore 排除），所以必须由 compose 把它读进来。
    # 只靠下面的 environment: 白名单是不够的——漏一个生产必需项（历史上先漏
    # API_KEY、后漏 AUTH_TOKEN_SECRET）容器就直接 CrashLoop。env_file 兜住全部
    # 配置，environment: 里的显式项仍然优先级更高（用于设默认值/改名）。
    # 与 docker-compose.prod.yml 保持一致。
    env_file:
      - .env
    environment:
      # 应用配置
      - APP_ENV=${APP_ENV:-production}
      - APP_VERSION=${APP_VERSION:-0.1.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PORT=8002

      # 数据库配置
      - DB_PATH=/app/data/app.db
      # PostgreSQL 切换（A2, ADR-004）：
      #   DB_BACKEND=postgres → 从 POSTGRES_* 自动组装 DATABASE_URL
      #   或直接设 DATABASE_URL=postgresql://… 覆盖分项配置
      - DB_BACKEND=${DB_BACKEND:-sqlite}
      - DATABASE_URL=${DATABASE_URL:-}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-airdrop}
      # 无默认值：留空时应用侧 DB_BACKEND=sqlite 用不到它（不影响），
      # 而切 postgres 时生产自检会因"没有密码"拒绝启动 —— 这正是要的行为。
      # 默认值必须与下面 postgres 服务的那一处保持一致，否则 app 连的库
      # 和 PG 建的库不是同一个（症状是启动即 "database does not exist"）。
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - POSTGRES_DB=${POSTGRES_DB:-airdrop}

      # LLM 配置（可选）
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_ENABLED=${LLM_ENABLED:-false}

      # API 配置
      # API_KEY 必须透传：APP_ENV 默认 production，而 config.py 的生产自检要求
      # API_KEY 非空且 >= 32 字符，否则拒绝启动。此前这里漏了这一行，运维即使
      # 在 .env 里正确设置了 API_KEY 也传不进容器，容器必然起不来。
      - API_KEY=${API_KEY}
      - MAX_CONCURRENT_PROJECTS=${MAX_CONCURRENT_PROJECTS:-10}
      - LLM_SEMAPHORE_SIZE=${LLM_SEMAPHORE_SIZE:-5}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
        required: false  # Compose 2.20+：postgres profile 未启用时跳过依赖
    networks:
      - airdrop-network
    labels:
      - "com.example.service=airdrop-alpha-backend"
      - "com.example.environment=${APP_ENV:-production}"

  # ══════════════════════════════════════════════════════════════
  # PostgreSQL Service (A2, ADR-004)
  # 默认不启动；启用方式：
  #   docker compose --profile postgres up -d
  # 并设 DB_BACKEND=postgres（或直接设 DATABASE_URL）
  # ══════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: airdrop-alpha-postgres
    restart: unless-stopped
    profiles:
      - postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airdrop}
      # 密码**没有默认值**，缺失时 compose 直接报错退出（`:?` 语法）。
      #
      # 此前这里是 `${POSTGRES_PASSWORD:-airdrop_test}`。危险在于本文件的
      # `APP_ENV` 默认是 **production**（见 backend 服务），所以
      # `docker compose --profile postgres up` 会以生产身份带着一个公开写在
      # 仓库里的密码静默跑起来，没有任何警告。
      #
      # 现在有两道闸门：这里让 compose 起不来（快速失败），
      # `config.py` 的生产自检拒绝弱口令与占位符（就算有人绕开 compose 也拦得住）。
      # 只靠应用侧不够 —— PG 容器自己会先用那个密码把数据目录初始化好，
      # 之后改环境变量也不会重置已有密码。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD（生成：python -c "import secrets; print(secrets.token_urlsafe(24))"）}
      POSTGRES_DB: ${POSTGRES_DB:-airdrop}
      TZ: ${TZ:-UTC}
    volumes:
      - airdrop_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airdrop} -d ${POSTGRES_DB:-airdrop}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - airdrop-network

  # ══════════════════════════════════════════════════════════════
  # Nginx Reverse Proxy (可选，用于生产环境)
  # ══════════════════════════════════════════════════════════════
  nginx:
    image: nginx:alpine
    container_name: airdrop-alpha-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - airdrop-network
    profiles:
      - production
    labels:
      - "com.example.service=airdrop-alpha-nginx"

networks:
  airdrop-network:
    driver: bridge

volumes:
  data:
    driver: local
  logs:
    driver: local
  airdrop_pg_data:
    driver: local
